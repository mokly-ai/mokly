[workspace]
members = ["xtask", "crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
mokly-model = { path = "crates/mokly-model" }
mokly-platform = { path = "crates/mokly-platform" }

mokly-sidecar = { path = "crates/mokly-sidecar" }
mokly-git = { path = "crates/mokly-git" }
mokly-publish = { path = "crates/mokly-publish" }
mokly-source-interface = { path = "crates/mokly-source-interface" }
mokly-catalogue = { path = "crates/mokly-catalogue" }
