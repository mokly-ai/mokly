id: prefer-imports-over-crate-paths
valid:
  - "use crate::error::Error;"
  - "use crate::{error::Error, runner::Runner};"
  - "use std::str;"
  - "use core::fmt::{self, Debug};"
  - "use ::std::io;"
  - "fn run() -> Result<(), Error> { Ok(()) }"
invalid:
  - "fn run() { crate::runner::run(); }"
  - "type Result = std::result::Result<(), crate::error::Error>;"
  - "fn run(value: &dyn crate::runner::Runner) {}"
  - "fn run(bytes: &[u8]) { std::str::from_utf8(bytes); }"
  - "fn run() { core::mem::size_of::<u8>(); }"
  - "type Result = std::result::Result<(), Error>;"
  - "fn run(bytes: &[u8]) { ::std::str::from_utf8(bytes); }"
