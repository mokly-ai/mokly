id: derive-disabled-from-write
language: Tsx
severity: error
message: >-
  A control backed by a `useWrite` reads `<write>.disabled`, which already
  answers "is it working, or is there nothing to send". Naming `.pending` on
  its own here is the second answer that drifted apart from the first in three
  consecutive reviews. Add `.disabled` for this control's own write; a
  neighbouring write's `.pending` may be combined with it. An input that is
  only held still while the write works reads `<write>.working`, which says
  that and nothing else. Do not copy a write's `.pending` into a local first:
  a control reading the copy reads a second answer this rule cannot see
  through, which is the same drift one name away.
files:
  - apps/app/src/**
rule:
  any:
    - kind: jsx_attribute
      all:
        - has:
            kind: property_identifier
            regex: ^disabled$
        - has:
            kind: jsx_expression
            pattern: $EXPR
            stopBy: end
            has:
              kind: member_expression
              regex: \.pending\b
              stopBy: end
        - not:
            has:
              kind: jsx_expression
              stopBy: end
              has:
                kind: member_expression
                regex: \.disabled\b
                stopBy: end
    # A local standing in for a write's `pending`, however it is spelled. The
    # value has to be the reading itself, so building a `WriteState` from a
    # write — which names `pending` as one of its fields — is not this.
    - kind: variable_declarator
      has:
        field: value
        any:
          - kind: member_expression
            regex: \.pending\b
          - kind: binary_expression
            has:
              kind: member_expression
              stopBy: end
              regex: \.pending\b
    - kind: variable_declarator
      has:
        field: name
        kind: object_pattern
        has:
          kind: shorthand_property_identifier_pattern
          regex: ^pending$
