id: write-failure-through-the-fragment
language: Tsx
severity: error
message: >-
  A surface does not word a refused write of its own. `useWrite(...).around` and
  `formFailure(...).around` return the registered `write-failure` fragment as
  one node — the cause announced immediately above the control that made the
  write, and the reference Mokly answered with disclosed beneath it — so no
  surface chooses that order for itself. Six panes assembled those pieces by
  hand and four of them put the cause below the control, and the account family
  named its operation in the field message. Pass the control to `.around(...)`.
  A state body's own disclosure is the `details` it hands its frame, and a cause
  that offers a link rather than one line is the documented exception; neither
  is this. A message that is not a refusal at all takes a composition of its
  own — `.fo-notice` is the flush one, and it is polite — rather than this one
  wearing a wrapper. The cause line is read wherever the announcement is
  written: on it, above it or inside it, as `role="alert"` or as
  `aria-live="assertive"`. Moving one attribute onto a neighbour is the same
  shape and the same finding, in either direction.
files:
  - packages/app/src/**
ignores:
  # The fragment's own definition. Every other surface in the package reads its
  # refusals through `.around(...)`, and a message that is not a refusal says so
  # with its own composition rather than with this one's pieces.
  - packages/app/src/components/write-failure.tsx
rule:
  any:
    # The fragment's own cause line, and whatever announces it.
    - kind: jsx_element
      all:
        - has:
            kind: jsx_opening_element
            has:
              kind: jsx_attribute
              all:
                - has:
                    kind: property_identifier
                    regex: ^className$
                - has:
                    kind: string
                    stopBy: end
                    regex: fo-copy
        # Announced, wherever the announcement is written: on the line, on a
        # wrapper above it, or on a node inside it. One attribute moved onto
        # a neighbour is the same composition.
        - any:
            - has:
                kind: jsx_attribute
                stopBy: end
                any:
                  - all:
                      - has:
                          kind: property_identifier
                          regex: ^role$
                      - has:
                          kind: string
                          stopBy: end
                          regex: ^["']alert["']$
                  - all:
                      - has:
                          kind: property_identifier
                          regex: ^aria-live$
                      - has:
                          kind: string
                          stopBy: end
                          regex: ^["']assertive["']$
            - inside:
                kind: jsx_element
                stopBy: end
                has:
                  kind: jsx_opening_element
                  has:
                    kind: jsx_attribute
                    any:
                      - all:
                          - has:
                              kind: property_identifier
                              regex: ^role$
                          - has:
                              kind: string
                              stopBy: end
                              regex: ^["']alert["']$
                      - all:
                          - has:
                              kind: property_identifier
                              regex: ^aria-live$
                          - has:
                              kind: string
                              stopBy: end
                              regex: ^["']assertive["']$
        # The documented exception is a cause that offers a link, because the
        # same request cannot be made to succeed. A link with nothing in it
        # offers nothing, and no other child is one.
        - not:
            has:
              kind: jsx_element
              stopBy: end
              all:
                - has:
                    kind: jsx_opening_element
                    has:
                      field: name
                      regex: ^(a|AppLink)$
                - any:
                    - has:
                        kind: jsx_text
                    - has:
                        kind: jsx_expression
    - kind: jsx_self_closing_element
      all:
        - has:
            field: name
            kind: identifier
            regex: ^ErrorDetails$
        - not:
            inside:
              kind: jsx_attribute
              stopBy: end
              has:
                kind: property_identifier
                regex: ^details$
    - kind: jsx_opening_element
      has:
        field: name
        kind: identifier
        regex: ^ErrorDetails$
