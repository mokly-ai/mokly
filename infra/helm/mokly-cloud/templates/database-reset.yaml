{{- if and .Values.resetDatabase (eq .Values.database.mode "cloudsql") }}
{{- $environment := include "mkc.environment" . }}
{{- $apiRole := printf "mkc-%s-api@%s.iam" $environment .Values.project }}
{{- $catalogueRole := printf "mkc-%s-cat@%s.iam" $environment .Values.project }}
{{- $resetRole := printf "mkc-%s-reset@%s.iam" $environment .Values.project }}
apiVersion: batch/v1
kind: Job
metadata:
  name: mokly-cloud-reset-database
  labels: { app.kubernetes.io/name: database-reset }
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 0
  template:
    metadata:
      labels: { app.kubernetes.io/name: database-reset }
    spec:
      restartPolicy: Never
      serviceAccountName: reset
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        {{- include "mkc.proxy" . | nindent 8 }}
      containers:
        - name: reset-database
          image: {{ .Values.postgres.image | quote }}
          command: [/bin/sh, -ceu]
          args:
            - |
              psql --dbname=mokly --set=ON_ERROR_STOP=1 <<'SQL'
              GRANT CONNECT, CREATE, TEMPORARY ON DATABASE mokly TO "{{ $apiRole }}";
              GRANT USAGE, CREATE ON SCHEMA public TO "{{ $apiRole }}";
              GRANT CONNECT ON DATABASE mokly TO "{{ $catalogueRole }}";
              GRANT USAGE, CREATE ON SCHEMA public TO "{{ $catalogueRole }}";
              SQL
          env:
            - { name: PGHOST, value: 127.0.0.1 }
            - { name: PGPORT, value: "5432" }
            - { name: PGUSER, value: {{ $resetRole | quote }} }
            - { name: PGSSLMODE, value: disable }
          securityContext:
            {{- include "mkc.security" . | nindent 12 }}
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mokly-cloud-grant-database
  labels: { app.kubernetes.io/name: database-reset }
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 0
  template:
    metadata:
      labels: { app.kubernetes.io/name: database-reset }
    spec:
      restartPolicy: Never
      serviceAccountName: api
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        {{- include "mkc.proxy" . | nindent 8 }}
      containers:
        - name: grant-database
          image: {{ .Values.postgres.image | quote }}
          command: [/bin/sh, -ceu]
          args:
            - |
              psql --dbname=mokly --set=ON_ERROR_STOP=1 <<'SQL'
              GRANT SELECT ON ALL TABLES IN SCHEMA public TO "{{ $catalogueRole }}";
              GRANT DELETE ON TABLE public.catalogue_grants TO "{{ $catalogueRole }}";
              ALTER DEFAULT PRIVILEGES FOR ROLE "{{ $apiRole }}" IN SCHEMA public
                GRANT SELECT ON TABLES TO "{{ $catalogueRole }}";
              SQL
          env:
            - { name: PGHOST, value: 127.0.0.1 }
            - { name: PGPORT, value: "5432" }
            - { name: PGUSER, value: {{ $apiRole | quote }} }
            - { name: PGSSLMODE, value: disable }
          securityContext:
            {{- include "mkc.security" . | nindent 12 }}
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
{{- end }}
