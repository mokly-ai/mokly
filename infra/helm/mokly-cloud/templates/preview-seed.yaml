{{- if eq .Values.environment "preview-pr" }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: preview-seed
spec:
  # Kubernetes requires a schedule. The release script alone starts seed Jobs.
  schedule: "0 0 * * *"
  timeZone: Etc/UTC
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1200
      backoffLimit: 0
      template:
        metadata:
          labels: { app.kubernetes.io/name: maintenance }
        spec:
          restartPolicy: Never
          serviceAccountName: api
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: api
              image: {{ .Values.api.image | quote }}
              args: [preview-seed]
              securityContext:
                {{- include "mkc.security" . | nindent 16 }}
              env:
                {{- include "mkc.apiEnv" . | nindent 16 }}
              resources:
                {{- toYaml .Values.api.resources | nindent 16 }}
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
                - { name: secrets, mountPath: /var/run/mokly-secrets, readOnly: true }
          volumes:
            - name: tmp
              emptyDir: { sizeLimit: 64Mi }
            {{- include "mkc.secretVolume" (dict "root" . "workload" "preview-seed") | nindent 12 }}
{{- end }}
