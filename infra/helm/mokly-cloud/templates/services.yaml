{{- range $name := list "api" "app" "catalogue" }}
{{- $workload := index $.Values $name }}
{{- if $workload.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  {{- if eq $.Values.database.mode "cloudsql" }}
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "{{ $name }}"}'
  {{- end }}
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: {{ $name }} }
  ports:
    - { name: http, port: {{ ternary $workload.port 80 (eq $.Values.database.mode "namespace") }}, targetPort: http }
{{- if eq $.Values.database.mode "cloudsql" }}
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ $name }}
spec:
  securityPolicy:
    name: {{ printf "mkc-%s" (include "mkc.environment" $) | quote }}
  timeoutSec: 30
  connectionDraining: { drainingTimeoutSec: 30 }
  healthCheck:
    type: HTTP
    requestPath: {{ $workload.healthPath | quote }}
    port: {{ $workload.port }}
    checkIntervalSec: 10
    timeoutSec: 5
{{- end }}
{{- end }}
{{- end }}
