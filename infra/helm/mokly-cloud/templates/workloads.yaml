{{- range $name := list "api" "app" "catalogue" }}
{{- $workload := index $.Values $name }}
{{- if $workload.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  {{- if eq $.Values.database.mode "namespace" }}
  replicas: 1
  {{- end }}
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  selector:
    matchLabels: { app.kubernetes.io/name: {{ $name }} }
  strategy:
    {{- /* One API replica with Recreate: two preview revisions never serve across a migration. */}}
    {{- if and (eq $.Values.database.mode "namespace") (eq $name "api") }}
    type: Recreate
    {{- else }}
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
    {{- end }}
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ $name }} }
    spec:
      serviceAccountName: {{ $name }}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: {{ $name }} }
      {{- if ne $name "app" }}
      initContainers:
        {{- if eq $.Values.database.mode "namespace" }}
        {{- include "mkc.namespaceInit" (dict "root" $ "workload" $name) | nindent 8 }}
        {{- else }}
        {{- include "mkc.proxy" $ | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ $workload.image | quote }}
          {{- if eq $name "api" }}
          args: [serve]
          {{- end }}
          securityContext:
            {{- include "mkc.security" $ | nindent 12 }}
          ports:
            - { name: http, containerPort: {{ $workload.port }} }
          env:
            {{- if eq $name "api" }}
            {{- include "mkc.apiEnv" $ | nindent 12 }}
            {{- else if eq $name "catalogue" }}
            {{- include "mkc.catalogueEnv" $ | nindent 12 }}
            {{- else }}
            {{- include "mkc.appEnv" $ | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet: { path: {{ $workload.healthPath | quote }}, port: http }
            timeoutSeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet: { path: {{ $workload.healthPath | quote }}, port: http }
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
          resources:
            {{- toYaml $workload.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if ne $name "app" }}
            - { name: secrets, mountPath: /var/run/mokly-secrets, readOnly: true }
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        {{- if ne $name "app" }}
        {{- include "mkc.secretVolume" (dict "root" $ "workload" $name) | nindent 8 }}
        {{- end }}
{{- end }}
{{- end }}
