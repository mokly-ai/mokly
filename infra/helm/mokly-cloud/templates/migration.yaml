{{- if eq .Values.database.mode "cloudsql" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: mokly-cloud-migrate
  labels: { app.kubernetes.io/name: migration }
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  backoffLimit: 0
  template:
    metadata:
      labels: { app.kubernetes.io/name: migration }
    spec:
      restartPolicy: Never
      serviceAccountName: api
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        {{- include "mkc.proxy" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ .Values.api.image | quote }}
          args: [migrate]
          securityContext:
            {{- include "mkc.security" . | nindent 12 }}
          env:
            {{- include "mkc.databaseEnv" (dict "root" . "identity" "api") | nindent 12 }}
          resources:
            {{- toYaml .Values.api.jobResources | nindent 12 }}
{{- end }}
