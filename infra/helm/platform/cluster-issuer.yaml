apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: mkc-preview-letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: mkc-preview-letsencrypt-account
    solvers:
      - selector:
          dnsZones:
            - __MKC_CATALOGUE_BASE_DOMAIN__
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: catalogue-dns-token
              key: api-token
