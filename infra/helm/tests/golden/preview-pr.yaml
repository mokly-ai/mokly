apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  selector:
    matchLabels: { app.kubernetes.io/name: catalogue }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: catalogue }
    spec:
      serviceAccountName: catalogue
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: catalogue }
      initContainers:
        - name: wait-for-api
          image: "us-central1-docker.pkg.dev/mokly-508518/mokly/app@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          command: [node, --input-type=module, -e]
          args:
            - |
              const deadline = performance.now() + 600_000;
              let ready = false;
              while (performance.now() < deadline) {
                try {
                  const timeout = Math.max(
                    1,
                    Math.ceil(Math.min(5_000, deadline - performance.now())),
                  );
                  const response = await fetch("http://api:8080/v1/health", {
                    signal: AbortSignal.timeout(timeout),
                  });
                  const health = await response.json();
                  if (
                    response.ok &&
                    health.status === "ok" &&
                    health.migrations === "current" &&
                    health.revision === process.env.MKC_EXPECTED_REVISION &&
                    performance.now() < deadline
                  ) {
                    ready = true;
                    break;
                  }
                } catch {
                  // Readiness, transport and response errors are retried within the deadline.
                }
                const delay = Math.min(2_000, deadline - performance.now());
                if (delay > 0) await new Promise((resolve) => setTimeout(resolve, delay));
              }
              if (!ready) {
                console.error("API readiness timed out for the intended revision.");
                process.exit(1);
              }
          env:
            - name: MKC_EXPECTED_REVISION
              value: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
      containers:
        - name: catalogue
          image: "us-central1-docker.pkg.dev/mokly-508518/mokly/catalogue@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: MKC_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: url }
            - name: MKC_CATALOGUE_ORIGIN
              value: "https://pr-42.preview.catalogues.invalid"
            - name: MKC_FILE_STORE
              value: gcs
            - name: MKC_GCS_BUCKET
              value: "mokly-508518-preview-blobs"
            - name: MKC_GCS_PREFIX
              value: "pr-42"
            - name: MKC_ENV
              value: preview
            - name: MKC_CATALOGUE_BIND
              value: "0.0.0.0:8080"
            - name: MKC_APP_ORIGIN
              value: "https://pr-42.preview.example.invalid"
            - name: MKC_CATALOGUE_HOT_CACHE_BYTES
              value: "134217728"
            - name: MKC_DESKTOP_CLIENT
