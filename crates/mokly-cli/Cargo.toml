[package]
name = "mokly-cli"
version = "0.14.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
mokly-compare = { workspace = true }
mokly-watch = { workspace = true }
mokly-render = { workspace = true }
mokly-sidecar = { workspace = true }
mokly-server = { workspace = true }
mokly-html = { workspace = true }
mokly-css = { workspace = true }
mokly-graph = { workspace = true }
async-trait = "0.1.92"
mokly-catalogue = { workspace = true }
mokly-source-interface = { workspace = true }
mokly-model = { workspace = true }
clap = { version = "4.6.7", features = ["derive", "env"] }
dunce = "1.0.5"
tempfile = "3.27.0"
terminal_size = "0.4.4"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "signal", "process", "io-util"] }
unicode-width = "0.2.2"
unimock = { version = "0.6.8", optional = true }
url = "2.5.8"
serde_json = "1.0.154"

crossterm = "0.29.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
chrono = { version = "0.4.45", features = ["clock"] }

[dev-dependencies]
mokly-platform = { workspace = true, features = ["mock"] }
mokly-compare = { workspace = true, features = ["mock"] }
mokly-watch = { workspace = true, features = ["mock"] }
tokio = { version = "1.53.3", features = ["test-util"] }
mokly-sidecar = { workspace = true, features = ["mock"] }

mokly-server = { workspace = true, features = ["mock"] }
mokly-catalogue = { workspace = true, features = ["mock"] }
mokly-graph = { workspace = true, features = ["mock"] }
insta = "1.49.0"
serde_json = "1.0.154"
tempfile = "3.27.0"
unimock = "0.6.8"
libc = "0.2.190"

[[bin]]
name = "mokly"
path = "src/main.rs"

[build-dependencies]
serde_json = "1.0.154"
thiserror = "2.0.21"

[features]
design-matrix = []
mock = ["dep:unimock", "mokly-publish/mock"]

[target."cfg(unix)".dependencies]
signal-hook = "0.3.18"

[target."cfg(not(unix))".dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }

[dependencies.mokly-publish]
workspace = true

[dependencies.mokly-git]
workspace = true

[dependencies.mokly-platform]
workspace = true

[dev-dependencies.mokly-publish]
workspace = true
features = ["mock"]

[dependencies.mokly-static]
workspace = true

[dev-dependencies.mokly-static]
workspace = true
features = ["mock"]

[[test]]
name = "design_attribution_tests"
path = "tests/design_attribution_tests.rs"
required-features = ["design-matrix"]
