[package]
name = "mokly-cli"
version = "0.14.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
mokly-render = { workspace = true }
mokly-sidecar = { workspace = true }
mokly-html = { workspace = true }
mokly-css = { workspace = true }
mokly-graph = { workspace = true }
async-trait = "0.1.92"
mokly-catalogue = { workspace = true }
mokly-source-interface = { workspace = true }
mokly-model = { workspace = true }
clap = { version = "4.6.7", features = ["derive", "env"] }
dunce = "1.0.5"
tempfile = "3.27.0"
terminal_size = "0.4.4"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "signal"] }
unicode-width = "0.2.2"
unimock = { version = "0.6.8", optional = true }
url = "2.5.8"
serde_json = "1.0.154"
ctrlc = { version = "3.5.2", features = ["termination"] }

[dev-dependencies]
mokly-sidecar = { workspace = true, features = ["mock"] }
mokly-catalogue = { workspace = true, features = ["mock"] }
mokly-graph = { workspace = true, features = ["mock"] }
insta = "1.49.0"
serde_json = "1.0.154"
tempfile = "3.27.0"
unimock = "0.6.8"

[[bin]]
name = "mokly"
path = "src/main.rs"

[build-dependencies]
serde_json = "1.0.154"
thiserror = "2.0.21"

[features]
mock = ["dep:unimock", "mokly-publish/mock"]

[dependencies.mokly-publish]
workspace = true

[dependencies.mokly-git]
workspace = true

[dependencies.mokly-platform]
workspace = true

[dev-dependencies.mokly-publish]
workspace = true
features = ["mock"]
