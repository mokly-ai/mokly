[package]
name = "mokly-cli"
version = "0.14.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
mokly-catalogue = { workspace = true }
mokly-source-interface = { workspace = true }
mokly-model = { workspace = true }
clap = { version = "4.6.7", features = ["derive", "env"] }
terminal_size = "0.4.4"
thiserror = "2.0.21"
unicode-width = "0.2.2"
url = "2.5.8"
serde_json = "1.0.154"

[dev-dependencies]
mokly-catalogue = { workspace = true, features = ["mock"] }
insta = "1.49.0"
serde_json = "1.0.154"
tempfile = "3.27.0"
unimock = "0.6.8"

[[bin]]
name = "mokly"
path = "src/main.rs"

[build-dependencies]
serde_json = "1.0.154"
thiserror = "2.0.21"
