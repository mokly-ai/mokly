[package]
name = "mokly-render"
version = "0.14.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
mokly-catalogue = { workspace = true }
mokly-model = { workspace = true }
mokly-html = { workspace = true }
mokly-css = { workspace = true }
mokly-graph = { workspace = true }
mokly-sidecar = { workspace = true }
mokly-source-interface = { workspace = true }
mokly-compare = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
globset = "0.4.20"

[features]
mock = []

[dev-dependencies]
mokly-css = { workspace = true, features = ["mock"] }
mokly-platform = { workspace = true, features = ["mock"] }
mokly-graph = { workspace = true, features = ["mock"] }
mokly-catalogue = { workspace = true, features = ["mock"] }
insta = "1.49.0"
mokly-sidecar = { workspace = true, features = ["mock"] }
mokly-source-interface = { workspace = true, features = ["mock"] }
tempfile = "3.27.0"
unimock = "0.6.8"
dunce = "1.0.5"
