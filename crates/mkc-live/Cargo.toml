[package]
name = "mkc-live"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only"
authors.workspace = true
rust-version.workspace = true
publish = false

[features]
test-support = []

[dependencies]
mkc-domain = { workspace = true }
mkc-live-interface = { workspace = true }
parking_lot = "0.12.5"
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.53.3", features = ["test-util"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"] }
unimock = "0.6.8"
uuid = "1.29.3"
