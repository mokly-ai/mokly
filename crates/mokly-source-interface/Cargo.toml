[package]
name = "mokly-source-interface"
version = "0.14.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
sha2 = "0.11.1"
thiserror = "2.0.21"
unimock = { version = "0.6.8", optional = true }

[features]
mock = ["dep:unimock"]

[target."cfg(unix)".dependencies]
libc = "0.2.190"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation"] }

[dev-dependencies]
unimock = "0.6.8"
