[package]
name = "mkc-file-store-local"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only"
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
mkc-file-store-interface = { workspace = true }
mkc-domain = { workspace = true }
tempfile = "3.27.0"
chrono = "0.4.45"
bytes = "1.12.1"
async-trait = "0.1.92"
tokio = { version = "1.53.1", features = ["fs", "io-util", "rt"] }
tokio-util = { version = "0.7.19", features = ["io"] }

[lints]
workspace = true

[dev-dependencies]
futures-util = "0.3.34"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
uuid = "1.26.1"
