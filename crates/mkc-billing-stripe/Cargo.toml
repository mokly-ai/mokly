[package]
name = "mkc-billing-stripe"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only"
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.8", features = ["derive"] }
hmac = "0.13.0"
internal-error.workspace = true
mkc-billing-interface.workspace = true
mkc-domain.workspace = true
reqwest = { version = "0.13.5", features = ["blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
unimock = "0.6.8"
url = "2.5.8"
uuid = { version = "1.29.3", features = ["v4"] }

[lints]
workspace = true

[[test]]
name = "cli"
path = "tests/cli/mod.rs"

[dev-dependencies]
tempfile = "3.27.0"
tiny_http = "0.12.0"
