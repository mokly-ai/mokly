thiserror = "2.0.20"
tiny_http = "0.12.0"
tokio = { version = "1.53.1", features = ["rt", "macros", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[lints]
workspace = true
