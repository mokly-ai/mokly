[package]
name = "mkc-live-pg"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only"
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
mkc-domain = { workspace = true }
mkc-live-interface = { workspace = true }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt", "sync", "time", "macros"] }
tokio-postgres = "0.7.18"
tracing = "0.1.44"

[dev-dependencies]
mkc-db = { workspace = true }
mkc-live = { workspace = true }
mkc-test-pg = { workspace = true }
tokio = { version = "1.53.3", features = ["test-util"] }
tokio-postgres = { version = "0.7.18", features = ["with-uuid-1"] }
uuid = { version = "1.29.3", features = ["v7"] }

[lints]
workspace = true
