[package]
name = "mokly-sidecar"
version = "0.14.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
unimock = { version = "0.6.8", optional = true }

[dev-dependencies]
insta = "1.49.0"
unimock = "0.6.8"

[features]
mock = ["dep:unimock"]


[dependencies.mokly-model]
workspace = true
