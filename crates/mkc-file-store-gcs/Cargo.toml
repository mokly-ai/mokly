[package]
name = "mkc-file-store-gcs"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only"
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
mkc-file-store-interface = { workspace = true }
mkc-domain = { workspace = true }
internal-error = { workspace = true }
reqwest = { version = "0.13.5", features = ["blocking", "json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.20"
unimock = "0.6.8"
url = "2.5.8"
serde_json = "1.0.151"
bytes = "1.12.1"
async-trait = "0.1.92"
futures-util = "0.3.34"
tokio = { version = "1.53.1", features = ["rt", "time"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt", "test-util", "time"] }
unimock = "0.6.8"
