[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
internal-error.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["now"] }
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"
toml = "1.2.1"

[dev-dependencies]
unimock = "0.6.8"

[dependencies.mokly-model]
workspace = true

[dependencies.mokly-sidecar]
workspace = true

[dev-dependencies.mokly-platform]
workspace = true
features = ["mock"]

[dev-dependencies.mokly-git]
workspace = true
features = ["mock"]

[dev-dependencies.mokly-sidecar]
workspace = true
features = ["mock"]
