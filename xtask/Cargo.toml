[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["now"] }
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"

[dev-dependencies]
fancy-regex = "0.19.2"
percent-encoding = "2.3.2"
pulldown-cmark = "0.13.4"
regex = "1.13.1"
tempfile = "3.27.0"
unimock = "0.6.8"
url = "2.5.8"
walkdir = "2.5.0"
yaml-rust2 = "0.13.0"

[dependencies.mokly-model]
workspace = true

[dependencies.mokly-sidecar]
workspace = true

[dev-dependencies.mokly-platform]
workspace = true
features = ["mock"]

[dev-dependencies.mokly-git]
workspace = true
features = ["mock"]

[dev-dependencies.mokly-sidecar]
workspace = true
features = ["mock"]
