[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
chrono = { version = "0.4.45", features = ["clock"] }
clap = { version = "4.6.2", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
thiserror = "2.0.19"

[dev-dependencies]
unimock = "0.6.8"
