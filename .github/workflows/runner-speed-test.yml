name: Runner speed test
on:
  push:
    paths:
      - .github/workflows/runner-speed-test.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Boat
            runner: boat
          - name: Blacksmith 8 vCPU
            runner: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: c9d402cdfa5f0c8301be67e8d46868854164a9f6 # origin/main at experiment start
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Set up npm
        run: npm install --global npm@11.21.0
      - name: Show runner hardware
        run: |
          lscpu | grep -E '^(CPU\(s\)|Model name):'
          free --human
          node --version
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
