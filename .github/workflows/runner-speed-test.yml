name: Runner speed test
on:
  push:
    paths:
      - .github/workflows/runner-speed-test.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Boat
            runner: boat
          - name: Blacksmith 8 vCPU
            runner: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Show runner hardware
        run: |
          lscpu | grep -E '^(CPU\(s\)|Model name):'
          free --human
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
