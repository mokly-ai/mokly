name: Site

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  CLOUDFLARE_PROJECT_NAME: mokly-site
  MOKLY_COMMENT_MARKER: "<!-- mokly-site -->"

jobs:
  deploy-main:
    name: Deploy Main Site
    if: github.ref == 'refs/heads/main' && vars.MKC_CLOUD_CUTOVER_ENABLED == 'true' && (github.event_name == 'push')
    runs-on: ubuntu-24.04
    env:
      MKC_DOMAIN: ${{ vars.MKC_DOMAIN }}
      SITE_ORIGIN: https://${{ vars.MKC_DOMAIN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Set up npm
        run: npm install --global npm@11.21.0
      - name: Validate deployment configuration
        run: |
          missing=0
          for setting in MKC_DOMAIN SITE_ORIGIN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PROJECT_NAME; do
            if [ -z "${!setting}" ]; then
              echo "::error title=Missing ${setting}::Configure ${setting} for the site workflow."
              missing=1
            fi
          done
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error title=Missing Cloudflare API token::Set repository secret CLOUDFLARE_PAGES_API_TOKEN or CLOUDFLARE_API_TOKEN."
            missing=1
          fi
          exit "${missing}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      - name: Install dependencies
        run: npm ci
      - name: Set up Rust
        run: rustup toolchain install
      - name: Build workspace packages
        run: npm run build
      - name: Build site
        run: npm run site:build
      - name: Deploy main site
        working-directory: apps/site
        run: npx --no-install wrangler pages deploy dist --project-name "${CLOUDFLARE_PROJECT_NAME}" --branch main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}

  deploy-pr:
    permissions:
      contents: read
      pull-requests: write
    name: Deploy PR Site
    if: >-
      vars.MKC_CLOUD_CUTOVER_ENABLED == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !(
        startsWith(github.event.pull_request.head.ref, 'release-please--') ||
        contains(join(github.event.pull_request.labels.*.name, ','), 'autorelease:')
      )
    runs-on: ubuntu-24.04
    env:
      MKC_DOMAIN: ${{ vars.MKC_DOMAIN }}
      SITE_ORIGIN: https://pr-${{ github.event.pull_request.number }}.mokly-site.pages.dev
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Set up npm
        run: npm install --global npm@11.21.0
      - name: Validate deployment configuration
        run: |
          missing=0
          for setting in MKC_DOMAIN SITE_ORIGIN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PROJECT_NAME; do
            if [ -z "${!setting}" ]; then
              echo "::error title=Missing ${setting}::Configure ${setting} for the site workflow."
              missing=1
            fi
          done
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error title=Missing Cloudflare API token::Set repository secret CLOUDFLARE_PAGES_API_TOKEN or CLOUDFLARE_API_TOKEN."
            missing=1
          fi
          exit "${missing}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      - name: Install dependencies
        run: npm ci
      - name: Set up Rust
        run: rustup toolchain install
      - name: Build workspace packages
        run: npm run build
      - name: Build site
        run: npm run site:build
      - name: Deploy site preview
        working-directory: apps/site
        run: |
          branch="$PREVIEW_BRANCH"
          npx --no-install wrangler pages deploy dist \
            --project-name "${CLOUDFLARE_PROJECT_NAME}" \
            --branch "${branch}"
        env:
          PREVIEW_BRANCH: pr-${{ github.event.pull_request.number }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      - name: Comment on pull request
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          APP_URL: https://pr-${{ github.event.pull_request.number }}.preview.${{ vars.MKC_DOMAIN }}/sign-in
          DEPLOY_STATUS: ${{ job.status }}
          PREVIEW_BRANCH: pr-${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ env.SITE_ORIGIN }}
        with:
          # Retry GitHub API server errors; 4xx answers still fail at once.
          retries: 3
          script: |
            const marker = process.env.MOKLY_COMMENT_MARKER;
            const lines = [
              marker,
              "### Mokly website",
              "",
              "Status: **" + process.env.DEPLOY_STATUS + "**",
              "- Preview: " + (process.env.PREVIEW_URL || "unavailable"),
              "- Cloudflare branch: " + (process.env.PREVIEW_BRANCH || "unknown"),
              "- Commit: " + context.payload.pull_request.head.sha,
              "- Workflow: " + context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId,
              "",
              "Open the app for this pull request: " + (process.env.APP_URL || "unavailable"),
            ];
            const body = lines.join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const existing = comments.find((comment) => comment.user?.type === "Bot" && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

  close-pr:
    permissions:
      contents: read
      pull-requests: write
    name: Close PR Site
    if: >-
      vars.MKC_CLOUD_CUTOVER_ENABLED == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !(
        startsWith(github.event.pull_request.head.ref, 'release-please--') ||
        contains(join(github.event.pull_request.labels.*.name, ','), 'autorelease:')
      )
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Delete Cloudflare Pages PR deployments
        id: cleanup
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_BRANCH: pr-${{ github.event.pull_request.number }}
        run: bash scripts/cloud/site/cleanup.sh
      - name: Mark preview inactive
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          CLEANUP_STATUS: ${{ steps.cleanup.outputs.status }}
          PREVIEW_BRANCH: pr-${{ github.event.pull_request.number }}
        with:
          # Retry GitHub API server errors; 4xx answers still fail at once.
          retries: 3
          script: |
            const marker = process.env.MOKLY_COMMENT_MARKER;
            const lines = [
              marker,
              "### Mokly website",
              "",
              "Status: **inactive**",
              "- Cloudflare branch: " + process.env.PREVIEW_BRANCH,
              "- Cleanup: " + (process.env.CLEANUP_STATUS || "retained: cleanup status unavailable"),
              "- PR closed at workflow: " + context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId,
            ];
            const body = lines.join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const existing = comments.find((comment) => comment.user?.type === "Bot" && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            }
