name: Blacksmith Testbox
on:
  push:
    branches:
      - "**"
    paths:
      - .github/workflows/blacksmith-testbox.yml
  workflow_dispatch:
    inputs:
      testbox_id:
        description: Testbox session ID supplied by blacksmith testbox warmup.
        required: false
        default: ""
        type: string
permissions:
  contents: read
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
jobs:
  testbox:
    name: Testbox
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Begin Testbox
        uses: useblacksmith/begin-testbox@233448af4bfdc6fca509a7f0974411ac6d8a8043 # v2
        with:
          testbox_id: ${{ inputs.testbox_id }}
      - name: Set up cloud Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Set up cloud npm and record its Node installation
        run: |
          npm install --global npm@11.21.0
          echo "MOKLY_CLOUD_NODE_BIN=$(dirname "$(command -v node)")" >> "$GITHUB_ENV"
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.15.0
          package-manager-cache: false
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up npm
        run: npm install --global npm@11.21.0
      - name: Set up Rust
        run: rustup toolchain install
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: mokly-tests
          cache-bin: false
          save-if: false
      - name: Install cargo-nextest
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.152
          fallback: none
      - name: Install dependencies
        run: npm ci
      - name: Build native artifacts
        run: cargo xtask build-native
      - name: Stamp installed lockfile
        run: |
          mkdir -p "$HOME/.mokly-testbox"
          sha256sum package-lock.json | cut -d ' ' -f1 > "$HOME/.mokly-testbox/package-lock.sha256"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install cloud verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 libpq-dev e2fsprogs xvfb
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER ROLE postgres WITH PASSWORD 'postgres'"
          sudo -u postgres createdb mkc_test
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
          bash infra/scripts/install-tools.sh
          bash infra/scripts/install-build-tools.sh
          bash infra/scripts/start-buildkit.sh
      - name: Expose job environment to Testbox sessions
        run: |
          sudo sed -i -E '/^(PATH|PLAYWRIGHT_CHANNEL|MOKLY_CLOUD_NODE_BIN|ELECTRON_SKIP_BINARY_DOWNLOAD|CARGO_INCREMENTAL|CARGO_PROFILE_DEV_DEBUG|CARGO_PROFILE_TEST_DEBUG)=/d' /etc/environment
          printf '%s=%s\n' \
            PATH "$PATH" \
            PLAYWRIGHT_CHANNEL chromium \
            MOKLY_CLOUD_NODE_BIN "${MOKLY_CLOUD_NODE_BIN:?}" \
            ELECTRON_SKIP_BINARY_DOWNLOAD "${ELECTRON_SKIP_BINARY_DOWNLOAD:?}" \
            CARGO_INCREMENTAL "${CARGO_INCREMENTAL:?}" \
            CARGO_PROFILE_DEV_DEBUG "${CARGO_PROFILE_DEV_DEBUG:?}" \
            CARGO_PROFILE_TEST_DEBUG "${CARGO_PROFILE_TEST_DEBUG:?}" |
            sudo tee -a /etc/environment >/dev/null
      - name: Run Testbox
        uses: useblacksmith/run-testbox@5ca05834db1d3813554d1dd109e5f2087a8d7cbc # v2
