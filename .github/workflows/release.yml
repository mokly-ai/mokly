name: Release
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_ref:
        description: Immutable vX.Y.Z CLI tag to verify and publish
        required: true
        type: string
      artifact_run_id:
        description: Original main-push run that holds the checked release archives
        required: true
        type: string
      verification:
        description: Reuse exact-tree CI evidence or run complete verification
        required: true
        type: choice
        options:
          - evidence
          - complete
        default: evidence
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      cli_release_created: ${{ steps.release.outputs.release_created }}
      cli_tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create or update release pull request
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
  select-release:
    permissions:
      actions: read
      contents: read
    if: always()
    needs:
      - release-please
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      artifact_run_id: ${{ steps.artifacts.outputs.artifact_run_id }}
      artifact_name: ${{ steps.artifacts.outputs.artifact_name }}
      publish_ref: ${{ steps.select.outputs.publish_ref }}
      verification: ${{ steps.select.outputs.verification }}
    steps:
      - name: Check out workflow scripts
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
      - name: Select immutable release
        id: select
        env:
          MANUAL_REF: ${{ inputs.publish_ref }}
          RELEASE_CREATED: ${{ needs.release-please.outputs.cli_release_created }}
          RELEASE_TAG: ${{ needs.release-please.outputs.cli_tag_name }}
          MANUAL_VERIFICATION: ${{ inputs.verification }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: node scripts/release/resolve-ref.mjs
      - name: Select checked release archives
        id: artifacts
        if: steps.select.outputs.publish_ref != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_EVENT: ${{ github.event_name }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          PUBLISH_REF: ${{ steps.select.outputs.publish_ref }}
        run: node scripts/release/select-artifacts.mjs
  release-tags:
    if: always() && needs.select-release.result == 'success' && needs.select-release.outputs.publish_ref != ''
    needs: [select-release]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Complete shared release tags
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PUBLISH_REF: ${{ needs.select-release.outputs.publish_ref }}
        with:
          script: |
            const cli = process.env.PUBLISH_REF;
            if (!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(cli)) {
              throw new Error('An immutable vX.Y.Z CLI tag is required');
            }
            const viewer = `viewer-${cli}`;
            const { data: source } = await github.rest.repos.getCommit({
              ...context.repo, ref: `tags/${cli}`,
            });
            try {
              await github.rest.git.getRef({
                ...context.repo, ref: `tags/${viewer}`,
              });
            } catch (error) {
              if (error.status !== 404 || context.eventName !== 'push') throw error;
              await github.rest.git.createRef({
                ...context.repo, ref: `refs/tags/${viewer}`, sha: source.sha,
              });
              return;
            }
            const { data: existing } = await github.rest.repos.getCommit({
              ...context.repo, ref: `tags/${viewer}`,
            });
            if (existing.sha !== source.sha) {
              throw new Error('CLI and viewer tags must identify the same commit');
            }
  build-native:
    if: always() && needs.select-release.result == 'success' && needs.release-tags.result == 'success' && needs.select-release.outputs.publish_ref != '' && needs.select-release.outputs.artifact_run_id == ''
    needs: [select-release, release-tags]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-gnu
            triple: x86_64-unknown-linux-gnu
            runner: blacksmith-2vcpu-ubuntu-2404
          - target: linux-arm64-gnu
            triple: aarch64-unknown-linux-gnu
            runner: blacksmith-2vcpu-ubuntu-2404-arm
          - target: darwin-arm64
            triple: aarch64-apple-darwin
            runner: blacksmith-6vcpu-macos-26
          - target: win32-x64-msvc
            triple: x86_64-pc-windows-msvc
            runner: blacksmith-2vcpu-windows-2025
          - target: darwin-x64
            triple: x86_64-apple-darwin
            runner: macos-26-intel
    env:
      RELEASE_TARGET: ${{ matrix.target }}
      RUST_TARGET: ${{ matrix.triple }}
      PUBLISH_REF: ${{ needs.select-release.outputs.publish_ref }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out immutable native release
        if: matrix.target != 'darwin-x64'
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          fetch-depth: 0
          ref: ${{ needs.select-release.outputs.publish_ref }}
          persist-credentials: false
      - name: Check out Intel macOS native release
        if: matrix.target == 'darwin-x64'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ needs.select-release.outputs.publish_ref }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Set up npm
        run: npm install --global npm@11.21.0
      - name: Set up Rust
        run: rustup toolchain install
      - name: Install target
        run: rustup target add "$RUST_TARGET"
      - name: Verify native release tags
        run: node scripts/release/verify-ref.mjs "$PUBLISH_REF"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Set up Linux release tools
        if: startsWith(matrix.target, 'linux-')
        run: node scripts/release/setup-linux.mjs
      - name: Require unpublished versions before building
        run: node scripts/release/verify-fresh.mjs
      - name: Build and pack target
        run: node scripts/release/build-native.mjs "$RELEASE_TARGET"
      - name: Inspect packed native binary and TLS dependencies
        run: node scripts/release/inspect-native.mjs "$RELEASE_TARGET"
      - name: Recheck native release source
        run: node scripts/release/verify-ref.mjs "$PUBLISH_REF"
      - name: Preserve native archive and TLS evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-native-${{ matrix.target }}
          path: .context/release-artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          overwrite: true
  prepare-release:
    if: always() && needs.select-release.result == 'success' && needs.release-tags.result == 'success' && (needs.build-native.result == 'success' || (needs.build-native.result == 'skipped' && needs.select-release.outputs.artifact_run_id != '')) && needs.select-release.outputs.publish_ref != ''
    needs: [select-release, release-tags, build-native]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-prepare.yml
    with:
      publish_ref: ${{ needs.select-release.outputs.publish_ref }}
      verification: ${{ needs.select-release.outputs.verification }}
      artifact_run_id: ${{ needs.select-release.outputs.artifact_run_id }}
  publish:
    if: always() && needs.select-release.result == 'success' && needs.prepare-release.result == 'success' && needs.select-release.outputs.publish_ref != ''
    needs: [select-release, prepare-release]
    # npm trusted publishing creates provenance only on GitHub-hosted runners.
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      PUBLISH_REF: ${{ needs.select-release.outputs.publish_ref }}
    steps:
      - name: Check out immutable release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ needs.select-release.outputs.publish_ref }}
          persist-credentials: false
      - name: Set up trusted-publishing runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ needs.prepare-release.outputs.node_version }}
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Set up npm
        run: npm install --global npm@11.21.0
      - name: Verify immutable tags
        run: node scripts/release/verify-ref.mjs "$PUBLISH_REF"
      - name: Download checked release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.prepare-release.outputs.artifact_name }}
          run-id: ${{ needs.prepare-release.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: .context
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Recheck exact publish artifacts
        id: package
        run: node scripts/release/pack.mjs .context/release-artifact --reuse
      - name: Recheck immutable tags and source
        run: node scripts/release/verify-ref.mjs "$PUBLISH_REF" --artifacts .context/release-artifact
      - name: Publish and verify native packages
        run: node scripts/release/publish-native.mjs .context/release-artifact
      - name: Guard existing UI package version
        id: ui_registry
        run: node scripts/release/registry.mjs --mode guard --report .context/release-artifact/ui/pack-report.json
      - name: Publish UI package with npm trusted publishing
        if: steps.ui_registry.outputs.published != 'true'
        env:
          ARCHIVE_PATH: ${{ steps.package.outputs.ui_archive_path }}
        run: npm publish "$ARCHIVE_PATH" --access public --ignore-scripts
      - name: Verify UI package registry package and provenance
        run: |
          node scripts/release/registry.mjs --mode verify --report .context/release-artifact/ui/pack-report.json --dist-tag latest
      - name: Guard existing viewer version
        id: viewer_registry
        run: node scripts/release/registry.mjs --mode guard --report .context/release-artifact/viewer/pack-report.json
      - name: Publish viewer with npm trusted publishing
        if: steps.viewer_registry.outputs.published != 'true'
        env:
          ARCHIVE_PATH: ${{ steps.package.outputs.viewer_archive_path }}
        run: npm publish "$ARCHIVE_PATH" --access public --ignore-scripts
      - name: Verify viewer registry package and provenance
        run: |
          node scripts/release/registry.mjs --mode verify --report .context/release-artifact/viewer/pack-report.json --dist-tag latest
      - name: Guard existing CLI version
        id: cli_registry
        run: node scripts/release/registry.mjs --mode guard --report .context/release-artifact/mokly/pack-report.json
      - name: Publish CLI with npm trusted publishing
        if: steps.cli_registry.outputs.published != 'true'
        env:
          ARCHIVE_PATH: ${{ steps.package.outputs.mokly_archive_path }}
        run: npm publish "$ARCHIVE_PATH" --access public --ignore-scripts
      - name: Verify CLI registry package and provenance
        run: node scripts/release/registry.mjs --mode verify --report .context/release-artifact/mokly/pack-report.json --dist-tag latest
