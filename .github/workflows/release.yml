name: Release
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_ref:
        description: Immutable vX.Y.Z CLI tag to verify and publish
        required: true
        type: string
      viewer_ref:
        description: Immutable viewer-vX.Y.Z tag to verify and publish
        required: true
        type: string
      artifact_run_id:
        description: Original main-push run that holds the checked release archives
        required: true
        type: string
      verification:
        description: Reuse exact-tree CI evidence or run complete verification
        required: true
        type: choice
        options:
          - evidence
          - complete
        default: evidence
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      cli_release_created: ${{ steps.release.outputs['packages/mokly--release_created'] }}
      cli_tag_name: ${{ steps.release.outputs['packages/mokly--tag_name'] }}
      viewer_release_created: ${{ steps.release.outputs['packages/viewer--release_created'] }}
      viewer_tag_name: ${{ steps.release.outputs['packages/viewer--tag_name'] }}
    steps:
      - name: Create or update release pull request
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
  select-release:
    permissions:
      actions: read
      contents: read
    if: always()
    needs:
      - release-please
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      artifact_run_id: ${{ steps.artifacts.outputs.artifact_run_id }}
      artifact_name: ${{ steps.artifacts.outputs.artifact_name }}
      publish_ref: ${{ steps.select.outputs.publish_ref }}
      viewer_ref: ${{ steps.select.outputs.viewer_ref }}
      verification: ${{ steps.select.outputs.verification }}
    steps:
      - name: Check out workflow scripts
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
      - name: Select immutable release
        id: select
        env:
          MANUAL_REF: ${{ inputs.publish_ref }}
          RELEASE_CREATED: ${{ needs.release-please.outputs.cli_release_created }}
          RELEASE_TAG: ${{ needs.release-please.outputs.cli_tag_name }}
          MANUAL_VERIFICATION: ${{ inputs.verification }}
          MANUAL_VIEWER_REF: ${{ inputs.viewer_ref }}
          RELEASE_EVENT: ${{ github.event_name }}
          VIEWER_RELEASE_CREATED: ${{ needs.release-please.outputs.viewer_release_created }}
          VIEWER_RELEASE_TAG: ${{ needs.release-please.outputs.viewer_tag_name }}
        run: node scripts/release/resolve-ref.mjs
      - name: Select checked release archives
        id: artifacts
        if: steps.select.outputs.publish_ref != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_EVENT: ${{ github.event_name }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          PUBLISH_REF: ${{ steps.select.outputs.publish_ref }}
        run: node scripts/release/select-artifacts.mjs
  build-native:
    if: always() && needs.select-release.result == 'success' && needs.select-release.outputs.publish_ref != '' && needs.select-release.outputs.artifact_run_id == ''
    needs: [select-release]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-gnu
            triple: x86_64-unknown-linux-gnu
            runner: blacksmith-2vcpu-ubuntu-2404
          - target: linux-arm64-gnu
            triple: aarch64-unknown-linux-gnu
            runner: blacksmith-2vcpu-ubuntu-2404-arm
          - target: darwin-arm64
            triple: aarch64-apple-darwin
            runner: blacksmith-6vcpu-macos-26
          - target: win32-x64-msvc
            triple: x86_64-pc-windows-msvc
            runner: blacksmith-2vcpu-windows-2025
          - target: darwin-x64
            triple: x86_64-apple-darwin
            runner: macos-26-intel
    env:
      RELEASE_TARGET: ${{ matrix.target }}
      RUST_TARGET: ${{ matrix.triple }}
      PUBLISH_REF: ${{ needs.select-release.outputs.publish_ref }}
      VIEWER_REF: ${{ needs.select-release.outputs.viewer_ref }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out immutable native release
        if: matrix.target != 'darwin-x64'
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          fetch-depth: 0
          ref: ${{ needs.select-release.outputs.publish_ref }}
      - name: Check out Intel macOS native release
        if: matrix.target == 'darwin-x64'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ needs.select-release.outputs.publish_ref }}
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Set up npm
        run: npm install --global npm@11.21.0
      - name: Set up Rust
        run: rustup toolchain install
      - name: Install target
        run: rustup target add "$RUST_TARGET"
      - name: Verify native release tags
        run: node scripts/release/verify-ref.mjs "$PUBLISH_REF" "$VIEWER_REF"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Set up Linux release tools
        if: startsWith(matrix.target, 'linux-')
        run: node scripts/release/setup-linux.mjs
      - name: Require unpublished versions before building
        run: node scripts/release/verify-fresh.mjs
      - name: Build and pack target
        run: node scripts/release/build-native.mjs "$RELEASE_TARGET"
      - name: Inspect packed native binary and TLS dependencies
        run: node scripts/release/inspect-native.mjs "$RELEASE_TARGET"
      - name: Recheck native release source
        run: node scripts/release/verify-ref.mjs "$PUBLISH_REF" "$VIEWER_REF"
      - name: Preserve native archive and TLS evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-native-${{ matrix.target }}
          path: .context/release-artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          overwrite: true
  publish:
    if: always() && needs.select-release.result == 'success' && (needs.build-native.result == 'success' || (needs.build-native.result == 'skipped' && needs.select-release.outputs.artifact_run_id != '')) && needs.select-release.outputs.publish_ref != ''
    needs:
      - release-please
      - select-release
      - build-native
    # npm trusted publishing creates provenance only on GitHub-hosted runners.
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      PUBLISH_REF: ${{ needs.select-release.outputs.publish_ref }}
      RELEASE_VERIFICATION: ${{ needs.select-release.outputs.verification }}
      VIEWER_REF: ${{ needs.select-release.outputs.viewer_ref }}
    steps:
      - name: Check out immutable release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ needs.select-release.outputs.publish_ref }}
      - name: Set up trusted-publishing runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Set up npm
        run: npm install --global npm@11.21.0
      - name: Verify immutable tags
        run: node scripts/release/verify-ref.mjs "$PUBLISH_REF" "$VIEWER_REF"
      - name: Resolve checked archives for publication
        id: publish_artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_EVENT: ${{ github.event_name }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: node scripts/release/select-artifacts.mjs
      - name: Download first-run checked release archives
        if: steps.publish_artifacts.outputs.artifact_run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ steps.publish_artifacts.outputs.artifact_name }}
          run-id: ${{ steps.publish_artifacts.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: .context
      - name: Install dependencies
        run: npm ci
      - name: Audit workspace dependencies
        run: npm run dependencies:check
      - name: Set up Rust
        run: rustup toolchain install
      - name: Audit Rust dependencies
        run: npm run dependencies:check:rust
      - name: Select verification evidence
        id: evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/evidence.mjs
      - name: Install Chromium for verification and smoke
        run: npx playwright install --with-deps chromium
      # A manual retry dispatches from main, whose head can be newer than the
      # checked-out tag; the suite runners require GITHUB_SHA to match HEAD.
      - name: Run complete verification
        env:
          PLAYWRIGHT_CHANNEL: chromium
        if: steps.evidence.outputs.mode != 'evidence'
        run: GITHUB_SHA="$(git rev-parse HEAD)" cargo xtask check --dependency-audit strict
      - name: Download native release archives
        if: steps.publish_artifacts.outputs.artifact_run_id == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-native-*
          path: .context/release-artifact
          merge-multiple: true
      - name: Prepare exact publish artifacts
        id: package
        env:
          ARTIFACT_RUN_ID: ${{ steps.publish_artifacts.outputs.artifact_run_id }}
        run: |
          if [ -n "$ARTIFACT_RUN_ID" ]; then
            node scripts/release/pack.mjs .context/release-artifact --reuse
          else
            node scripts/release/verify-fresh.mjs
            node scripts/release/pack.mjs .context/release-artifact
          fi
      - name: Smoke-test exact publish artifacts
        run: node scripts/release/smoke.mjs .context/release-artifact
      - name: Recheck immutable tags and source
        run: node scripts/release/verify-ref.mjs "$PUBLISH_REF" "$VIEWER_REF" --artifacts .context/release-artifact
      - name: Preserve checked artifacts
        if: steps.publish_artifacts.outputs.artifact_run_id == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mokly-release-${{ steps.package.outputs.mokly_version }}
          path: |
            .context/release-artifact/
            .context/release-evidence/record.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          overwrite: true
      - name: Publish and verify native packages
        run: node scripts/release/publish-native.mjs .context/release-artifact
      - name: Guard existing viewer version
        id: viewer_registry
        run: node scripts/release/registry.mjs --mode guard --report .context/release-artifact/viewer/pack-report.json
      - name: Publish viewer with npm trusted publishing
        if: steps.viewer_registry.outputs.published != 'true'
        env:
          ARCHIVE_PATH: ${{ steps.package.outputs.viewer_archive_path }}
        run: npm publish "$ARCHIVE_PATH" --access public --ignore-scripts
      - name: Verify viewer registry package and provenance
        run: node scripts/release/registry.mjs --mode verify --report .context/release-artifact/viewer/pack-report.json --dist-tag latest
      - name: Guard existing CLI version
        id: cli_registry
        run: node scripts/release/registry.mjs --mode guard --report .context/release-artifact/mokly/pack-report.json
      - name: Publish CLI with npm trusted publishing
        if: steps.cli_registry.outputs.published != 'true'
        env:
          ARCHIVE_PATH: ${{ steps.package.outputs.mokly_archive_path }}
        run: npm publish "$ARCHIVE_PATH" --access public --ignore-scripts
      - name: Verify CLI registry package and provenance
        run: node scripts/release/registry.mjs --mode verify --report .context/release-artifact/mokly/pack-report.json --dist-tag latest
