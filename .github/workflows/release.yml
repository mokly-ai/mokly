name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_ref:
        description: Existing immutable CLI vX.Y.Z tag to verify and publish
        required: true
        type: string
      viewer_ref:
        description: Paired immutable viewer-vX.Y.Z tag from the same commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      viewer_release_created: ${{ steps.release.outputs['packages/viewer--release_created'] }}
      viewer_tag_name: ${{ steps.release.outputs['packages/viewer--tag_name'] }}
    steps:
      - name: Create or update release pull request
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  select-release:
    if: always()
    needs: [release-please]
    runs-on: ubuntu-latest
    outputs:
      publish_ref: ${{ steps.select.outputs.publish_ref }}
      viewer_ref: ${{ steps.select.outputs.viewer_ref }}
    steps:
      - name: Check out workflow scripts
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Select immutable release
        id: select
        env:
          MANUAL_REF: ${{ inputs.publish_ref }}
          MANUAL_VIEWER_REF: ${{ inputs.viewer_ref }}
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          VIEWER_RELEASE_CREATED: ${{ needs.release-please.outputs.viewer_release_created }}
          VIEWER_RELEASE_TAG: ${{ needs.release-please.outputs.viewer_tag_name }}
        run: node scripts/release/resolve-ref.mjs

  publish:
    if: always() && needs.select-release.result == 'success' && needs.select-release.outputs.publish_ref != '' && needs.select-release.outputs.viewer_ref != ''
    needs: [release-please, select-release]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      CLI_REF: ${{ needs.select-release.outputs.publish_ref }}
      VIEWER_REF: ${{ needs.select-release.outputs.viewer_ref }}
    steps:
      - name: Check out immutable release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ needs.select-release.outputs.publish_ref }}
      - name: Set up trusted-publishing runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Set up npm
        run: npm install --global npm@11.7.0
      - name: Set up Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.95.0
      - name: Verify immutable tags
        run: node scripts/release/verify-ref.mjs "$CLI_REF" "$VIEWER_REF"
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run complete verification
        run: cargo xtask check
      - name: Prepare exact publish artifacts
        id: package
        run: node scripts/release/pack.mjs .context/release-artifact
      - name: Smoke-test exact publish artifacts
        run: node scripts/package-smoke.mjs --artifacts .context/release-artifact
      - name: Recheck immutable tags and source
        run: node scripts/release/verify-ref.mjs "$CLI_REF" "$VIEWER_REF"
      - name: Preserve checked artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mokly-${{ steps.package.outputs.cli_version }}-viewer-${{ steps.package.outputs.viewer_version }}
          path: |
            .context/release-artifact/
          if-no-files-found: error
      - name: Guard existing viewer version
        id: viewer_registry
        run: node scripts/release/registry.mjs --mode guard --report .context/release-artifact/viewer/pack-report.json
      - name: Publish viewer with npm trusted publishing
        if: steps.viewer_registry.outputs.published != 'true'
        env:
          ARCHIVE_PATH: ${{ steps.package.outputs.viewer_archive_path }}
        run: npm publish "$ARCHIVE_PATH" --access public --ignore-scripts
      - name: Verify viewer registry package and provenance
        run: node scripts/release/registry.mjs --mode verify --report .context/release-artifact/viewer/pack-report.json --dist-tag latest
      - name: Guard existing CLI version
        id: cli_registry
        run: node scripts/release/registry.mjs --mode guard --report .context/release-artifact/cli/pack-report.json
      - name: Publish CLI with npm trusted publishing
        if: steps.cli_registry.outputs.published != 'true'
        env:
          ARCHIVE_PATH: ${{ steps.package.outputs.cli_archive_path }}
        run: npm publish "$ARCHIVE_PATH" --access public --ignore-scripts
      - name: Verify CLI registry package and provenance
        run: node scripts/release/registry.mjs --mode verify --report .context/release-artifact/cli/pack-report.json --dist-tag latest
