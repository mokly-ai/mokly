name: Evidence host URL reproduction
on:
  push:
    branches:
      - calummoore/fu-flaky-workspace-evidence-host-url-u9kr
permissions:
  contents: read
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
jobs:
  browser:
    name: Browser shard 4/4 (sample ${{ matrix.sample }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4, 5]
    env:
      PLAYWRIGHT_CHANNEL: chromium
      MOKLY_VERIFICATION_RUNTIME: node-22.15.0
      MOKLY_VERIFICATION_REPORT: .context/verification-reports/evidence-host-url-reproduction-sample-${{ matrix.sample }}.json
      MOKLY_REPRODUCTION_LOG: .context/flaky-workspace-evidence-host-url/ci-sample-${{ matrix.sample }}.log
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.15.0
          package-manager-cache: false
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up npm
        run: npm install --global npm@11.21.0
      - name: Set up Rust
        run: rustup toolchain install
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-binary
          cache-bin: false
          save-if: false
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser shard
        shell: bash
        run: |
          mkdir -p .context/flaky-workspace-evidence-host-url
          set +e
          cargo xtask check --suite browser --shard 4/4 2>&1 | tee "$MOKLY_REPRODUCTION_LOG"
          shard_status=${PIPESTATUS[0]}
          exit "$shard_status"
      - name: Retain reproduction evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-host-url-reproduction-sample-${{ matrix.sample }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ env.MOKLY_VERIFICATION_REPORT }}
            ${{ env.MOKLY_REPRODUCTION_LOG }}
            .context/playwright-results/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
