name: Desktop release

on:
  # The release workflow calls this workflow after a desktop release pull
  # request merges. It passes the tag and the commit that Release Please made.
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      ref:
        required: true
        type: string
    secrets:
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
      DESKTOP_RELEASES_TOKEN:
        required: false
  pull_request:
    paths:
      - apps/**
      - packages/**
      - crates/mokly-*/**
      - Cargo.lock
      - rust-toolchain.toml
      - package.json
      - package-lock.json
      - infra/docker/app-build-config.mjs
      - infra/scripts/render-values.py
      - infra/scripts/build_values.py
      - fixtures/desktop-origin.json
      - .nvmrc
      - .github/workflows/desktop-release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ inputs.tag || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: Package desktop (${{ matrix.platform }})
    if: vars.MKC_CLOUD_CUTOVER_ENABLED == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-26
          - platform: linux
            runner: ubuntu-24.04
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      MKC_DOMAIN: ${{ vars.MKC_DOMAIN }}
      MKC_CATALOGUE_BASE_DOMAIN: ${{ vars.MKC_CATALOGUE_BASE_DOMAIN }}
      MKC_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Check out the source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install npm
        run: npm install --global npm@11.21.0
      - name: Resolve main-preview build inputs
        run: python3 packages/desktop/scripts/release-environment.py main-preview >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci
      - name: Install Linux launch dependencies
        if: runner.os == 'Linux'
        run: |
          npm exec --workspace @mokly-cloud/desktop -- playwright install-deps chromium
          sudo apt-get install -y xvfb
      - name: Install Rust
        run: rustup toolchain install
      - name: Build workspace packages
        run: npm run build
      - name: Build the bundled export
        run: npm run build --workspace @mokly-cloud/desktop
      - name: Package without release credentials
        run: node packages/desktop/scripts/package.mjs preview
      - name: Launch the packaged app offline
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a node packages/desktop/scripts/packaged-smoke.mjs
          else
            node packages/desktop/scripts/packaged-smoke.mjs
          fi
      - name: Upload desktop packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
            packages/desktop/release/*.yml
            packages/desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 14
      - name: Retain packaged launch evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-smoke-${{ matrix.platform }}
          path: .context/desktop-app-shell/packaged-smoke-*
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Release desktop (${{ matrix.platform }})
    # A called workflow sees the caller's push event. Only that call has a tag.
    if: vars.MKC_CLOUD_CUTOVER_ENABLED == 'true' && github.event_name == 'push' && inputs.tag != ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # The environment admits only main and holds the signing secrets.
    environment: desktop-release
    permissions:
      contents: read
    strategy:
      # Run the publishers in sequence so both fill the same draft.
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-26
          - platform: linux
            runner: ubuntu-24.04
    env:
      MKC_DOMAIN: ${{ vars.MKC_DOMAIN }}
      MKC_CATALOGUE_BASE_DOMAIN: ${{ vars.MKC_CATALOGUE_BASE_DOMAIN }}
      MKC_BUILD_SHA: ${{ inputs.ref }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Check the tag and resolve production build inputs
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 packages/desktop/scripts/release-environment.py production --tag "$RELEASE_TAG" >> "$GITHUB_ENV"
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install npm
        run: npm install --global npm@11.21.0
      - name: Install dependencies
        run: npm ci
      - name: Install Rust
        run: rustup toolchain install
      - name: Build workspace packages
        run: npm run build
      - name: Build the bundled export with the updater on
        env:
          MKC_DESKTOP_UPDATES: enabled
        run: npm run build --workspace @mokly-cloud/desktop
      - name: Sign and notarize macOS packages
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node packages/desktop/scripts/package.mjs release-build
      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: node packages/desktop/scripts/package.mjs release-build
      - name: Upload the build record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-build-record-${{ matrix.platform }}-${{ github.run_attempt }}
          path: packages/desktop/release/desktop-build-record.json
          if-no-files-found: error
          retention-days: 35
      - name: Download earlier build records
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-build-record-${{ matrix.platform }}-*
          path: ${{ runner.temp }}/build-records
      - name: Publish macOS packages
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASES_TOKEN }}
          RECORDS: ${{ runner.temp }}/build-records
        run: node packages/desktop/scripts/package.mjs release-publish "$RECORDS"
      - name: Publish Linux packages
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASES_TOKEN }}
          RECORDS: ${{ runner.temp }}/build-records
        run: node packages/desktop/scripts/package.mjs release-publish "$RECORDS"
      - name: Upload the verified release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-release-${{ matrix.platform }}
          path: packages/desktop/release/desktop-release-manifest.json
          if-no-files-found: error
          overwrite: true
          retention-days: 35

  promote:
    name: Promote desktop release
    # A failed platform job skips promotion and leaves the release in draft.
    needs: [release]
    if: vars.MKC_CLOUD_CUTOVER_ENABLED == 'true' && github.event_name == 'push' && inputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: desktop-release
    permissions:
      contents: read
    steps:
      - name: Check out the release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Download the verified release manifests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-release-*
          path: ${{ runner.temp }}/desktop-release
      - name: Promote the checked draft to the latest release
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASES_TOKEN }}
          RELEASES: ${{ runner.temp }}/desktop-release
        run: node packages/desktop/scripts/release-promote.mjs "$RELEASES"
