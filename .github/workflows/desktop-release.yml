name: Desktop release

on:
  push:
    tags: [desktop-v*]
  pull_request:
    paths:
      - apps/**
      - packages/**
      - crates/mokly-*/**
      - Cargo.lock
      - rust-toolchain.toml
      - package.json
      - package-lock.json
      - infra/docker/app-build-config.mjs
      - infra/scripts/render-values.py
      - infra/scripts/build_values.py
      - fixtures/desktop-origin.json
      - .nvmrc
      - .github/workflows/desktop-release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: Package desktop (${{ matrix.platform }})
    if: vars.MKC_CLOUD_CUTOVER_ENABLED == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-26
          - platform: linux
            runner: ubuntu-24.04
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      MKC_DOMAIN: ${{ vars.MKC_DOMAIN }}
      MKC_CATALOGUE_BASE_DOMAIN: ${{ vars.MKC_CATALOGUE_BASE_DOMAIN }}
      MKC_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Check out the source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache-dependency-path: package-lock.json
      - name: Install npm
        run: npm install --global npm@11.21.0
      - name: Resolve main-preview build inputs
        run: python3 apps/desktop/scripts/release-environment.py main-preview >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci
      - name: Install Linux launch dependencies
        if: runner.os == 'Linux'
        run: |
          npm exec --workspace @mokly-cloud/desktop -- playwright install-deps chromium
          sudo apt-get install -y xvfb
      - name: Install Rust
        run: rustup toolchain install
      - name: Build workspace packages
        run: npm run build
      - name: Build the bundled export
        run: npm run build --workspace @mokly-cloud/desktop
      - name: Package without release credentials
        run: node apps/desktop/scripts/package.mjs preview
      - name: Launch the packaged app offline
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a node apps/desktop/scripts/packaged-smoke.mjs
          else
            node apps/desktop/scripts/packaged-smoke.mjs
          fi
      - name: Upload desktop packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 14
      - name: Retain packaged launch evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-smoke-${{ matrix.platform }}
          path: .context/desktop-app-shell/packaged-smoke-*
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Release desktop (${{ matrix.platform }})
    if: vars.MKC_CLOUD_CUTOVER_ENABLED == 'true' && (startsWith(github.ref, 'refs/tags/desktop-v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      # Both publishers share one release. Serialize its creation and uploads.
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-26
          - platform: linux
            runner: ubuntu-24.04
    env:
      MKC_DOMAIN: ${{ vars.MKC_DOMAIN }}
      MKC_CATALOGUE_BASE_DOMAIN: ${{ vars.MKC_CATALOGUE_BASE_DOMAIN }}
      MKC_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Check the tag and resolve production build inputs
        run: python3 apps/desktop/scripts/release-environment.py production --tag "$GITHUB_REF_NAME" >> "$GITHUB_ENV"
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache-dependency-path: package-lock.json
      - name: Install npm
        run: npm install --global npm@11.21.0
      - name: Install dependencies
        run: npm ci
      - name: Install Rust
        run: rustup toolchain install
      - name: Build workspace packages
        run: npm run build
      - name: Build the bundled export
        run: npm run build --workspace @mokly-cloud/desktop
      - name: Sign, notarize and publish macOS packages
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASES_TOKEN }}
        run: node apps/desktop/scripts/package.mjs release
      - name: Publish Linux packages
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASES_TOKEN }}
        run: node apps/desktop/scripts/package.mjs release
