name: CI
on:
  pull_request: null
  workflow_dispatch: null
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
jobs:
  profile:
    name: Runtime profile
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    outputs:
      node-24-version: ${{ steps.node-version.outputs.value }}
      node-matrix: ${{ steps.profile.outputs.node-matrix }}
      verification-runtimes: ${{ steps.profile.outputs.verification-runtimes }}
    steps:
      - name: Select Node verification profile
        id: profile
        env:
          RELEASE_PULL_REQUEST: |-
            ${{
              github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository &&
              (
                startsWith(github.event.pull_request.head.ref, 'release-please--') ||
                contains(join(github.event.pull_request.labels.*.name, ','), 'autorelease:')
              )
            }}
        run: |
          echo "release-pull-request=$RELEASE_PULL_REQUEST" >> "$GITHUB_OUTPUT"
          if [ "$RELEASE_PULL_REQUEST" = "true" ]; then
            echo 'node-matrix=["22.15.0","24"]' >> "$GITHUB_OUTPUT"
            echo 'verification-runtimes=node-22.15.0,node-24' >> "$GITHUB_OUTPUT"
          else
            echo 'node-matrix=["22.15.0"]' >> "$GITHUB_OUTPUT"
            echo 'verification-runtimes=node-22.15.0' >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      # Read the exact version that floating Node 24 resolved to; the repository
      # job and every Node 24 job request it. The `node-version` output of
      # actions/setup-node holds the same version with a leading `v`; this step
      # omits the `v`.
      - name: Capture exact Node.js version
        id: node-version
        run: echo "value=$(node --print 'process.versions.node')" >> "$GITHUB_OUTPUT"
  repository:
    name: Repository
    needs:
      - profile
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ needs.profile.outputs.node-24-version }}
          package-manager-cache: false
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up npm
        run: npm install --global npm@11.21.0
      - name: Set up Rust
        run: rustup toolchain install
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: audit-tool-${{ hashFiles('.cargo/audit-tool/Cargo.lock', 'scripts/verification/rust-audit-tool.mjs') }}
          cache-directories: .context/rust-audit-tool
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install dependencies
        run: npm ci
      - name: Build native artifacts
        run: cargo xtask build-native
      - name: Run repository verification
        env:
          DEPENDENCY_AUDIT: |-
            ${{
              github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository &&
              (
                startsWith(github.event.pull_request.head.ref, 'dependency-audit/') ||
                contains(github.event.pull_request.labels.*.name, 'dependency-audit') ||
                startsWith(github.event.pull_request.head.ref, 'release-please--') ||
                contains(join(github.event.pull_request.labels.*.name, ','), 'autorelease:')
              ) && 'strict' || 'baseline'
            }}
        run: cargo xtask check --suite repository --dependency-audit "$DEPENDENCY_AUDIT"
  viewer:
    name: Viewer (Node ${{ matrix.node }})
    needs:
      - profile
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.profile.outputs.node-matrix) }}
    env:
      MOKLY_VERIFICATION_RUNTIME: node-${{ matrix.node }}
      MOKLY_VERIFICATION_REPORT: .context/verification-reports/viewer-node-${{ matrix.node }}-full.json
    steps:
      - name: Check out repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node == '24' && needs.profile.outputs.node-24-version || matrix.node }}
          package-manager-cache: false
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up npm
        run: npm install --global npm@11.21.0
      - name: Set up Rust
        run: rustup toolchain install
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-binary
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install dependencies
        run: npm ci
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true
      - name: Run viewer verification
        run: cargo xtask check --suite viewer
      - name: Retain viewer inventory and timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-viewer-node-${{ matrix.node }}
          path: ${{ env.MOKLY_VERIFICATION_REPORT }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 14
  browser:
    name: Browser (Node ${{ matrix.node }}, shard ${{ matrix.shard }}/4)
    needs: [profile]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.profile.outputs.node-matrix) }}
        shard: [1, 2, 3, 4]
    env:
      PLAYWRIGHT_CHANNEL: chromium
      MOKLY_VERIFICATION_RUNTIME: node-${{ matrix.node }}
      MOKLY_VERIFICATION_REPORT: .context/verification-reports/browser-node-${{ matrix.node }}-shard-${{ matrix.shard }}-of-4.json
    steps:
      - name: Check out repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node == '24' && needs.profile.outputs.node-24-version || matrix.node }}
          package-manager-cache: false
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up npm
        run: npm install --global npm@11.21.0
      - name: Set up Rust
        run: rustup toolchain install
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-binary
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser shard
        run: cargo xtask check --suite browser --shard ${{ matrix.shard }}/4
      - name: Retain browser inventory and timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-browser-node-${{ matrix.node }}-shard-${{ matrix.shard }}
          path: ${{ env.MOKLY_VERIFICATION_REPORT }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 14
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failures-node-${{ matrix.node }}-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: .context/playwright-results/
          include-hidden-files: true
          retention-days: 14
  native:
    name: Native (${{ matrix.runner }})
    needs:
      - profile
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner:
          - blacksmith-6vcpu-macos-26
          - blacksmith-8vcpu-windows-2025
    steps:
      - name: Check out repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        env:
          BLACKSMITH_BYPASS_CHECKOUT: ${{ runner.os != 'Linux' && 'true' || 'false' }}
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.15.0
          package-manager-cache: false
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up npm
        run: npm install --global npm@11.21.0
      - name: Set up Rust
        run: rustup toolchain install
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install dependencies
        run: npm ci
      - name: Build UI package
        run: npm run build --workspace @mokly/ui
      - name: Build viewer package
        run: npm run build --workspace @mokly/viewer
      - name: Build sidecar package
        run: npm run build --workspace @mokly/mokly
      - name: Run native verification
        run: cargo xtask check --suite native
  static-delivery:
    name: Static delivery (Node ${{ matrix.node }})
    needs: [profile]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.profile.outputs.node-matrix) }}
    env:
      PLAYWRIGHT_CHANNEL: chromium
      MOKLY_VERIFICATION_RUNTIME: node-${{ matrix.node }}
    steps:
      - name: Check out repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node == '24' && needs.profile.outputs.node-24-version || matrix.node }}
          package-manager-cache: false
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up npm
        run: npm install --global npm@11.21.0
      - name: Set up Rust
        run: rustup toolchain install
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-binary
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build native and JavaScript packages
        run: npm run build
      - name: Check example static HTTP and file delivery
        run: npm run test:delivery:prepared
      - name: Retain static delivery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: static-delivery-node-${{ matrix.node }}
          path: .context/static-delivery/*.json
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 14
      - name: Retain static delivery failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: static-delivery-failures-node-${{ matrix.node }}-attempt-${{ github.run_attempt }}
          path: .context/playwright-results/
          include-hidden-files: true
          retention-days: 14
  required:
    name: Required CI
    if: always()
    needs:
      - profile
      - repository
      - viewer
      - browser
      - native
      - static-delivery
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Check out report validator
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ needs.profile.outputs.node-24-version }}
          package-manager-cache: false
      - name: Download suite evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: verification-*
          path: .context/downloaded-verification
      - name: Require every verification job
        env:
          PROFILE_RESULT: ${{ needs.profile.result }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          VIEWER_RESULT: ${{ needs.viewer.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          STATIC_DELIVERY_RESULT: ${{ needs.static-delivery.result }}
        run: |
          test "$PROFILE_RESULT" = success
          test "$REPOSITORY_RESULT" = success
          test "$VIEWER_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$NATIVE_RESULT" = success
          test "$STATIC_DELIVERY_RESULT" = success
      - name: Require complete suite evidence
        env:
          EXPECTED_RUNTIMES: ${{ needs.profile.outputs.verification-runtimes }}
        run: node scripts/verification/aggregate.mjs --reports .context/downloaded-verification --commit "${GITHUB_SHA}" --runtimes "$EXPECTED_RUNTIMES"
