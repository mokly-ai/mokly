name: CI
on:
  pull_request: null
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  repository:
    name: Repository
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    outputs:
      node-24-version: ${{ steps.node-version.outputs.value }}
      node-matrix: ${{ steps.profile.outputs.node-matrix }}
      verification-runtimes: ${{ steps.profile.outputs.verification-runtimes }}
    steps:
      - name: Check out repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          fetch-depth: 0
      - name: Select Node verification profile
        id: profile
        env:
          RELEASE_PULL_REQUEST: |-
            ${{
              github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository &&
              (
                startsWith(github.event.pull_request.head.ref, 'release-please--') ||
                contains(join(github.event.pull_request.labels.*.name, ','), 'autorelease:')
              )
            }}
        run: |
          if [ "$RELEASE_PULL_REQUEST" = "true" ]; then
            echo 'node-matrix=["22.14.0","24"]' >> "$GITHUB_OUTPUT"
            echo 'verification-runtimes=node-22.14.0,node-24' >> "$GITHUB_OUTPUT"
          else
            echo 'node-matrix=["22.14.0"]' >> "$GITHUB_OUTPUT"
            echo 'verification-runtimes=node-22.14.0' >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Capture exact Node.js version
        id: node-version
        run: echo "value=$(node --print 'process.versions.node')" >> "$GITHUB_OUTPUT"
      - name: Set up npm
        run: npm install --global npm@11.21.0
      - name: Set up Rust
        run: rustup toolchain install
      - name: Install dependencies
        run: npm ci
      - name: Build native artifacts
        run: cargo xtask build-native
      - name: Run repository verification
        env:
          DEPENDENCY_AUDIT: |-
            ${{
              github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository &&
              (
                startsWith(github.event.pull_request.head.ref, 'dependency-audit/') ||
                contains(github.event.pull_request.labels.*.name, 'dependency-audit') ||
                startsWith(github.event.pull_request.head.ref, 'release-please--') ||
                contains(join(github.event.pull_request.labels.*.name, ','), 'autorelease:')
              ) && 'strict' || 'baseline'
            }}
        run: cargo xtask check --suite repository --dependency-audit "$DEPENDENCY_AUDIT"
  viewer:
    name: Viewer (Node ${{ matrix.node }})
    needs:
      - repository
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.repository.outputs.node-matrix) }}
    env:
      MOKLY_VERIFICATION_RUNTIME: node-${{ matrix.node }}
      MOKLY_VERIFICATION_REPORT: .context/verification-reports/viewer-node-${{ matrix.node }}-full.json
    steps:
      - name: Check out repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node == '24' && needs.repository.outputs.node-24-version || matrix.node }}
          package-manager-cache: false
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up npm
        run: npm install --global npm@11.21.0
      - name: Set up Rust
        run: rustup toolchain install
      - name: Install dependencies
        run: npm ci
      - name: Run viewer verification
        run: cargo xtask check --suite viewer
      - name: Retain viewer inventory and timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-viewer-node-${{ matrix.node }}
          path: ${{ env.MOKLY_VERIFICATION_REPORT }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 14
  native:
    name: Native (${{ matrix.runner }})
    needs:
      - repository
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner:
          - blacksmith-6vcpu-macos-26
          - blacksmith-2vcpu-windows-2025
    steps:
      - name: Check out repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.14.0
          package-manager-cache: false
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up npm
        run: npm install --global npm@11.21.0
      - name: Set up Rust
        run: rustup toolchain install
      - name: Install dependencies
        run: npm ci
      - name: Run native verification
        run: cargo xtask check --suite native
  required:
    name: Required CI
    if: always()
    needs:
      - repository
      - viewer
      - native
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Check out report validator
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ needs.repository.outputs.node-24-version }}
          package-manager-cache: false
      - name: Download viewer evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: verification-*
          path: .context/downloaded-verification
      - name: Require every verification job
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          VIEWER_RESULT: ${{ needs.viewer.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          test "$REPOSITORY_RESULT" = success
          test "$VIEWER_RESULT" = success
          test "$NATIVE_RESULT" = success
      - name: Require complete viewer evidence
        env:
          EXPECTED_RUNTIMES: ${{ needs.repository.outputs.verification-runtimes }}
        run: node scripts/verification/aggregate.mjs --reports .context/downloaded-verification --commit "${GITHUB_SHA}" --runtimes "$EXPECTED_RUNTIMES"
