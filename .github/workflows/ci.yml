name: CI
on:
  pull_request: null
  workflow_dispatch: null
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
jobs:
  profile:
    name: Runtime profile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      node-24-version: ${{ steps.node-version.outputs.value }}
      node-matrix: ${{ steps.profile.outputs.node-matrix }}
      verification-runtimes: ${{ steps.profile.outputs.verification-runtimes }}
      viewer-shards: ${{ steps.shards.outputs.viewer }}
      viewer-shard-total: ${{ steps.shards.outputs.viewer-total }}
      browser-shards: ${{ steps.shards.outputs.browser }}
      browser-shard-total: ${{ steps.shards.outputs.browser-total }}
    steps:
      - name: Check out shard totals
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          sparse-checkout: scripts/verification/ci-shards.json
          sparse-checkout-cone-mode: false
      # The viewer and browser matrices, the aggregate, and remote
      # verification all read the shard totals from this one file.
      - name: Read shard totals
        id: shards
        run: |
          for suite in viewer browser; do
            total=$(jq --exit-status --arg suite "$suite" '.[$suite] | select(type == "number" and . >= 1 and . == floor)' scripts/verification/ci-shards.json)
            echo "$suite-total=$total" >> "$GITHUB_OUTPUT"
            echo "$suite=$(jq --compact-output --null-input --argjson total "$total" '[range(1; $total + 1)]')" >> "$GITHUB_OUTPUT"
          done
      - name: Select Node verification profile
        id: profile
        env:
          RELEASE_PULL_REQUEST: |-
            ${{
              github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository &&
              (
                startsWith(github.event.pull_request.head.ref, 'release-please--') ||
                contains(join(github.event.pull_request.labels.*.name, ','), 'autorelease:')
              )
            }}
        run: |
          echo "release-pull-request=$RELEASE_PULL_REQUEST" >> "$GITHUB_OUTPUT"
          if [ "$RELEASE_PULL_REQUEST" = "true" ]; then
            echo 'node-matrix=["22.15.0","24"]' >> "$GITHUB_OUTPUT"
            echo 'verification-runtimes=node-22.15.0,node-24' >> "$GITHUB_OUTPUT"
          else
            echo 'node-matrix=["22.15.0"]' >> "$GITHUB_OUTPUT"
            echo 'verification-runtimes=node-22.15.0' >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      # Read the exact version that floating Node 24 resolved to; the repository
      # job and every Node 24 job request it. The `node-version` output of
      # actions/setup-node holds the same version with a leading `v`; this step
      # omits the `v`.
      - name: Capture exact Node.js version
        id: node-version
        run: echo "value=$(node --print 'process.versions.node')" >> "$GITHUB_OUTPUT"
  repository:
    name: Repository (shard ${{ matrix.shard }})
    needs:
      - profile
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # Shard 1 runs every check except the Mokly Rust tests. Shards 2 to 5
        # each build and run one weighted share of the Rust test targets, and
        # shard 2 also runs the doc tests.
        shard: [1/5, 2/5, 3/5, 4/5, 5/5]
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ needs.profile.outputs.node-24-version }}
          package-manager-cache: false
      - name: Set up npm
        run: npm install --global npm@11.21.0
      - name: Set up Rust
        run: rustup toolchain install
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The checks shard and the test shards build different artifacts, so
          # each keeps its own entry. Only the checks shard installs the tool.
          key: ${{ startsWith(matrix.shard, '1/') && 'checks' || 'tests' }}-audit-tool-${{ hashFiles('.cargo/audit-tool/Cargo.lock', 'scripts/verification/rust-audit-tool.mjs') }}
          cache-directories: .context/rust-audit-tool
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.152
          fallback: none
      - name: Restore npm download cache
        id: npm-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Run repository verification
        env:
          DEPENDENCY_AUDIT: |-
            ${{
              github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository &&
              (
                startsWith(github.event.pull_request.head.ref, 'dependency-audit/') ||
                contains(github.event.pull_request.labels.*.name, 'dependency-audit') ||
                startsWith(github.event.pull_request.head.ref, 'release-please--') ||
                contains(join(github.event.pull_request.labels.*.name, ','), 'autorelease:')
              ) && 'strict' || 'baseline'
            }}
          REPOSITORY_SHARD: ${{ matrix.shard }}
        run: cargo xtask check --suite repository --shard "$REPOSITORY_SHARD" --dependency-audit "$DEPENDENCY_AUDIT"
  viewer:
    name: Viewer (Node ${{ matrix.node }}, shard ${{ matrix.shard }}/${{ needs.profile.outputs.viewer-shard-total }})
    needs:
      - profile
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.profile.outputs.node-matrix) }}
        shard: ${{ fromJSON(needs.profile.outputs.viewer-shards) }}
    env:
      MOKLY_VERIFICATION_RUNTIME: node-${{ matrix.node }}
      MOKLY_VERIFICATION_REPORT: .context/verification-reports/viewer-node-${{ matrix.node }}-shard-${{ matrix.shard }}-of-${{ needs.profile.outputs.viewer-shard-total }}.json
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node == '24' && needs.profile.outputs.node-24-version || matrix.node }}
          package-manager-cache: false
      - name: Set up npm
        run: npm install --global npm@11.21.0
      - name: Set up Rust
        run: rustup toolchain install
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-binary
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Restore npm download cache
        id: npm-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Save npm download cache
        if: github.ref == 'refs/heads/main' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true
      - name: Run viewer shard
        env:
          VIEWER_SHARD: ${{ matrix.shard }}/${{ needs.profile.outputs.viewer-shard-total }}
        run: cargo xtask check --suite viewer --shard "$VIEWER_SHARD"
      - name: Retain viewer inventory and timings
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-viewer-node-${{ matrix.node }}-shard-${{ matrix.shard }}
          path: ${{ env.MOKLY_VERIFICATION_REPORT }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 14
  browser:
    name: Browser (Node ${{ matrix.node }}, shard ${{ matrix.shard }}/${{ needs.profile.outputs.browser-shard-total }})
    needs: [profile]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.profile.outputs.node-matrix) }}
        shard: ${{ fromJSON(needs.profile.outputs.browser-shards) }}
    env:
      PLAYWRIGHT_CHANNEL: chromium
      MOKLY_VERIFICATION_RUNTIME: node-${{ matrix.node }}
      MOKLY_VERIFICATION_REPORT: .context/verification-reports/browser-node-${{ matrix.node }}-shard-${{ matrix.shard }}-of-${{ needs.profile.outputs.browser-shard-total }}.json
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node == '24' && needs.profile.outputs.node-24-version || matrix.node }}
          package-manager-cache: false
      - name: Set up npm
        run: npm install --global npm@11.21.0
      - name: Set up Rust
        run: rustup toolchain install
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-binary
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Restore npm download cache
        id: npm-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser shard
        env:
          BROWSER_SHARD: ${{ matrix.shard }}/${{ needs.profile.outputs.browser-shard-total }}
        run: cargo xtask check --suite browser --shard "$BROWSER_SHARD"
      - name: Retain browser inventory and timings
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-browser-node-${{ matrix.node }}-shard-${{ matrix.shard }}
          path: ${{ env.MOKLY_VERIFICATION_REPORT }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 14
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failures-node-${{ matrix.node }}-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: .context/playwright-results/
          include-hidden-files: true
          retention-days: 14
  native:
    name: Native (${{ matrix.runner }}, shard ${{ matrix.shard }})
    needs:
      - profile
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Shard 1 checks formatting and Clippy. Each later shard builds and
        # runs one weighted share of the Rust test targets: five on macOS and
        # six on Windows. Shard 2 also runs the doc tests.
        include:
          - runner: macos-26
            shard: 1/6
          - runner: macos-26
            shard: 2/6
          - runner: macos-26
            shard: 3/6
          - runner: macos-26
            shard: 4/6
          - runner: macos-26
            shard: 5/6
          - runner: macos-26
            shard: 6/6
          - runner: windows-2025
            shard: 1/7
          - runner: windows-2025
            shard: 2/7
          - runner: windows-2025
            shard: 3/7
          - runner: windows-2025
            shard: 4/7
          - runner: windows-2025
            shard: 5/7
          - runner: windows-2025
            shard: 6/7
          - runner: windows-2025
            shard: 7/7
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.15.0
          package-manager-cache: false
      - name: Set up npm
        run: npm install --global npm@11.21.0
      - name: Set up Rust
        run: rustup toolchain install
      # The lint shard restores the test build entry and never saves it: Clippy
      # reuses its build scripts and procedural macros, and the cache holds no
      # second entry for each host.
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' && !startsWith(matrix.shard, '1/') }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.152
          fallback: none
      # The Windows runner image moves npm's cache out of the home folder.
      - name: Locate npm download cache
        id: npm-cache-path
        shell: bash
        run: echo "path=$(npm config get cache)" >> "$GITHUB_OUTPUT"
      - name: Restore npm download cache
        id: npm-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.npm-cache-path.outputs.path }}
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Save npm download cache
        if: github.ref == 'refs/heads/main' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.npm-cache-path.outputs.path }}
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}
      - name: Build UI package
        run: npm run build --workspace @mokly/ui
      - name: Build model package
        run: npm run build --workspace @mokly/model
      - name: Build frame package
        run: npm run build --workspace @mokly/frame
      - name: Build viewer package
        run: npm run build --workspace @mokly/viewer
      - name: Build sidecar package
        run: npm run build --workspace @mokly/mokly
      - name: Run native verification
        shell: bash
        env:
          NATIVE_SHARD: ${{ matrix.shard }}
        run: cargo xtask check --suite native --shard "$NATIVE_SHARD"
  static-delivery:
    name: Static delivery (Node ${{ matrix.node }})
    needs: [profile]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.profile.outputs.node-matrix) }}
    env:
      PLAYWRIGHT_CHANNEL: chromium
      MOKLY_VERIFICATION_RUNTIME: node-${{ matrix.node }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node == '24' && needs.profile.outputs.node-24-version || matrix.node }}
          package-manager-cache: false
      - name: Set up npm
        run: npm install --global npm@11.21.0
      - name: Set up Rust
        run: rustup toolchain install
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-binary
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Restore npm download cache
        id: npm-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build native and JavaScript packages
        run: npm run build
      - name: Check example static HTTP and file delivery
        run: npm run test:delivery:prepared
      - name: Retain static delivery evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: static-delivery-node-${{ matrix.node }}
          path: .context/static-delivery/*.json
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 14
      - name: Retain static delivery failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: static-delivery-failures-node-${{ matrix.node }}-attempt-${{ github.run_attempt }}
          path: .context/playwright-results/
          include-hidden-files: true
          retention-days: 14
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    needs: [profile]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Workspace checks
            command: cloud-rust
            additional_suites: cloud-migrations cloud-typecheck cloud-openapi cloud-fixtures cloud-emails cloud-openapi-lint cloud-terraform cloud-origin-router cloud-helm cloud-toolchain-pins
            install_dependencies: true
            browser_workspace: ""
            postgres: true
            infrastructure: true
            rust_cache: true
          - name: Desktop checks
            command: cloud-desktop
            install_dependencies: true
            browser_workspace: "@mokly-cloud/desktop"
            postgres: true
            infrastructure: false
            rust_cache: true
          - name: App checks 1/8
            command: cloud-app
            shard: "1/8"
            install_dependencies: true
            browser_workspace: "@mokly-cloud/app"
            postgres: true
            infrastructure: false
            rust_cache: true
          - name: App checks 2/8
            command: cloud-app
            shard: "2/8"
            install_dependencies: true
            browser_workspace: "@mokly-cloud/app"
            postgres: true
            infrastructure: false
            rust_cache: true
          - name: App checks 3/8
            command: cloud-app
            shard: "3/8"
            install_dependencies: true
            browser_workspace: "@mokly-cloud/app"
            postgres: true
            infrastructure: false
            rust_cache: true
          - name: App checks 4/8
            command: cloud-app
            shard: "4/8"
            install_dependencies: true
            browser_workspace: "@mokly-cloud/app"
            postgres: true
            infrastructure: false
            rust_cache: true
          - name: App checks 5/8
            command: cloud-app
            shard: "5/8"
            install_dependencies: true
            browser_workspace: "@mokly-cloud/app"
            postgres: true
            infrastructure: false
            rust_cache: true
          - name: App checks 6/8
            command: cloud-app
            shard: "6/8"
            install_dependencies: true
            browser_workspace: "@mokly-cloud/app"
            postgres: true
            infrastructure: false
            rust_cache: true
          - name: App checks 7/8
            command: cloud-app
            shard: "7/8"
            install_dependencies: true
            browser_workspace: "@mokly-cloud/app"
            postgres: true
            infrastructure: false
            rust_cache: true
          - name: App checks 8/8
            command: cloud-app
            shard: "8/8"
            install_dependencies: true
            browser_workspace: "@mokly-cloud/app"
            postgres: true
            infrastructure: false
            rust_cache: true
          # Mockup shard 1 runs the checks without a browser, shard 2 the policy
          # and served suites, and shards 3 to 6 split the disk browser suite.
          - name: Mockup checks 1/6
            command: cloud-mockups
            shard: "1/6"
            install_dependencies: true
            browser_workspace: ""
            postgres: false
            infrastructure: false
            rust_cache: true
          - name: Mockup checks 2/6
            command: cloud-mockups
            shard: "2/6"
            install_dependencies: true
            browser_workspace: "@mokly-cloud/mockups"
            postgres: false
            infrastructure: false
            rust_cache: true
          - name: Mockup checks 3/6
            command: cloud-mockups
            shard: "3/6"
            install_dependencies: true
            browser_workspace: "@mokly-cloud/mockups"
            postgres: false
            infrastructure: false
            rust_cache: true
          - name: Mockup checks 4/6
            command: cloud-mockups
            shard: "4/6"
            install_dependencies: true
            browser_workspace: "@mokly-cloud/mockups"
            postgres: false
            infrastructure: false
            rust_cache: true
          - name: Mockup checks 5/6
            command: cloud-mockups
            shard: "5/6"
            install_dependencies: true
            browser_workspace: "@mokly-cloud/mockups"
            postgres: false
            infrastructure: false
            rust_cache: true
          - name: Mockup checks 6/6
            command: cloud-mockups
            shard: "6/6"
            install_dependencies: true
            browser_workspace: "@mokly-cloud/mockups"
            postgres: false
            infrastructure: false
            rust_cache: true
          - name: Site checks 1/2
            command: cloud-site
            shard: "1/2"
            install_dependencies: true
            browser_workspace: "@mokly-cloud/site"
            postgres: false
            infrastructure: false
            rust_cache: true
          - name: Site checks 2/2
            command: cloud-site
            shard: "2/2"
            install_dependencies: true
            browser_workspace: "@mokly-cloud/site"
            postgres: false
            infrastructure: false
            rust_cache: true
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: ${{ matrix.command != 'cloud-desktop' && '1' || '' }}
      # Database-backed partitions provision Postgres below. GitHub HTTP fixtures
      # run locally; no registered App credentials are used.
      MKC_TEST_DATABASE_URL: postgres://postgres:postgres@localhost/mkc_test
    steps:
      - name: Check out the complete history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install npm
        run: npm install --global npm@11.21.0
      - name: Set up Rust
        run: rustup toolchain install
      - name: Restore Rust dependencies
        if: matrix.rust_cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The mockup and site partitions build only xtask and the native
          # binary, as the Mokly jobs do, so they share their cache. The other
          # partitions also build mkc- crates and keep a cache each.
          shared-key: ${{ (matrix.command == 'cloud-mockups' || matrix.command == 'cloud-site') && 'native-binary' || matrix.command }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-nextest
        if: matrix.command == 'cloud-rust'
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.152
          fallback: none
      - name: Restore Electron download
        if: matrix.command == 'cloud-desktop'
        id: electron-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-44.11.3
      - name: Restore npm download cache
        if: matrix.install_dependencies
        id: npm-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: matrix.install_dependencies
        run: npm ci
      - name: Install Chromium
        if: matrix.browser_workspace != ''
        env:
          BROWSER_WORKSPACE: ${{ matrix.browser_workspace }}
        run: npm exec --workspace "$BROWSER_WORKSPACE" -- playwright install --with-deps chromium
      - name: Install virtual display
        if: matrix.command == 'cloud-desktop'
        run: sudo apt-get install -y xvfb
      - name: Start Postgres 16 for integration tests
        if: matrix.postgres
        run: |
          # The runner image ships these packages. Install only the missing ones.
          missing=()
          for package in postgresql-16 libpq-dev e2fsprogs; do
            dpkg-query --show --showformat='${db:Status-Status}' "$package" 2>/dev/null |
              grep -qx installed || missing+=("$package")
          done
          if (( ${#missing[@]} )); then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER ROLE postgres WITH PASSWORD 'postgres'"
          sudo -u postgres createdb mkc_test
          pg_isready -h localhost -p 5432
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: Install Terraform and Helm
        if: matrix.infrastructure
        run: bash infra/scripts/install-tools.sh
      - name: Verify the partition
        env:
          XTASK_COMMAND: ${{ matrix.command }}
          SHARD: ${{ matrix.shard }}
          ADDITIONAL_SUITES: ${{ matrix.additional_suites }}
        run: |
          shard=()
          [[ -z "$SHARD" ]] || shard=(--shard "$SHARD")
          cargo xtask check --suite "$XTASK_COMMAND" "${shard[@]}"
          for suite in $ADDITIONAL_SUITES; do
            cargo xtask check --suite "$suite"
          done
      # Electron downloads its binary when the desktop tests first start it.
      - name: Save Electron download
        if: matrix.command == 'cloud-desktop' && github.ref == 'refs/heads/main' && steps.electron-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/electron
          key: ${{ steps.electron-cache.outputs.cache-primary-key }}

  images:
    name: Workload image checks
    runs-on: ubuntu-24.04
    needs: [profile]
    timeout-minutes: 60
    steps:
      - name: Check out the source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Restore npm download cache
        id: npm-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install npm and dependencies
        run: |
          npm install --global npm@11.21.0
          npm ci
      - name: Set up Rust
        run: rustup toolchain install
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install bounded-storage host tools
        run: |
          # The runner image ships these packages. Install only the missing ones.
          missing=()
          for package in postgresql-16 libpq-dev e2fsprogs; do
            dpkg-query --show --showformat='${db:Status-Status}' "$package" 2>/dev/null |
              grep -qx installed || missing+=("$package")
          done
          if (( ${#missing[@]} )); then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER ROLE postgres WITH PASSWORD 'postgres'"
          sudo -u postgres createdb mkc_test
          pg_isready -h localhost -p 5432
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: Install pinned standalone image tools
        run: bash infra/scripts/install-build-tools.sh
      - name: Start layered BuildKit
        env:
          MKC_BUILDKIT_REQUIRE_LAYERED: "true"
        run: bash infra/scripts/start-buildkit.sh
      - name: Verify storage behavior and workload images
        run: cargo xtask check --suite cloud-infrastructure
      - name: Retain image BuildKit diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buildkit-images
          path: /tmp/mkc-buildkit.log
          if-no-files-found: warn
          retention-days: 14

  cloud-provider-plan:
    name: Credential-gated infrastructure plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.MKC_CLOUD_CUTOVER_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_PLAN_SERVICE_ACCOUNT }}
      MKC_REGION: ${{ vars.MKC_REGION }}
      MKC_DOMAIN: ${{ vars.MKC_DOMAIN }}
      MKC_CLOUDFLARE_ZONE_ID: ${{ vars.MKC_CLOUDFLARE_ZONE_ID }}
      MKC_CATALOGUE_BASE_DOMAIN: ${{ vars.MKC_CATALOGUE_BASE_DOMAIN }}
      MKC_CATALOGUE_CLOUDFLARE_ZONE_ID: ${{ vars.MKC_CATALOGUE_CLOUDFLARE_ZONE_ID }}
      MKC_NOTIFICATION_CHANNELS: ${{ vars.MKC_NOTIFICATION_CHANNELS }}
      MKC_STATE_BUCKET: ${{ vars.MKC_STATE_BUCKET }}
    steps:
      - name: Check out the trusted main revision
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Gate the real provider plan
        id: credentials
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            bash infra/scripts/credential-gate.sh
          else
            echo 'SKIP terraform-plan: provider credentials are reserved for trusted main pushes'
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate the plan identity
        if: steps.credentials.outputs.enabled == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_PLAN_SERVICE_ACCOUNT }}
      - name: Install Google Cloud CLI
        if: steps.credentials.outputs.enabled == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: 585.0.0
      - name: Plan main-preview with real providers
        if: steps.credentials.outputs.enabled == 'true'
        run: |
          bash infra/scripts/install-tools.sh
          bash infra/scripts/terraform-environment.sh main-preview plan

  plan:
    name: Cloud provider plan result
    if: ${{ always() }}
    needs: [cloud-provider-plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the plan only on a permitted main push
        env:
          PLAN_RESULT: ${{ needs.cloud-provider-plan.result }}
          PLAN_EXPECTED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.MKC_CLOUD_CUTOVER_ENABLED == 'true' }}
        run: |
          if [[ "$PLAN_EXPECTED" == true ]]; then
            test "$PLAN_RESULT" = success
          else
            test "$PLAN_RESULT" = skipped
            echo 'SKIP terraform-plan: requires main push after cloud cutover'
          fi

  site-lighthouse:
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    name: Site Lighthouse
    continue-on-error: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the complete history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Set up npm
        run: npm install --global npm@11.21.0
      - name: Restore npm download cache
        id: npm-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npm exec --workspace @mokly-cloud/site -- playwright install --with-deps chromium
      - name: Select Chromium for Lighthouse
        working-directory: apps/site
        run: |
          chrome_path=$(node scripts/chromium-path.mjs)
          printf 'CHROME_PATH=%s\n' "$chrome_path" >> "$GITHUB_ENV"
      - name: Set up Rust
        run: rustup toolchain install
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-binary
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build workspace packages
        run: npm run build
      - name: Build site
        run: npm run site:build
      - name: Run Lighthouse budget
        shell: bash
        run: |
          mkdir -p test-results/site-lighthouse
          npm run site:lighthouse 2>&1 | tee test-results/site-lighthouse/report.txt
      - name: Retain Lighthouse failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: site-lighthouse
          path: test-results/site-lighthouse/
          if-no-files-found: warn
          retention-days: 14

  required:
    name: Required CI
    if: ${{ always() }}
    needs:
      - profile
      - repository
      - viewer
      - browser
      - native
      - static-delivery
      - check
      - images
      - plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out report validator
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ needs.profile.outputs.node-24-version }}
          package-manager-cache: false
      - name: Download suite evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: verification-*
          path: .context/downloaded-verification
      - name: Require every verification job
        env:
          PROFILE_RESULT: ${{ needs.profile.result }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          VIEWER_RESULT: ${{ needs.viewer.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          STATIC_DELIVERY_RESULT: ${{ needs.static-delivery.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          IMAGE_RESULT: ${{ needs.images.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
        run: |
          test "$PROFILE_RESULT" = success
          test "$REPOSITORY_RESULT" = success
          test "$VIEWER_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$NATIVE_RESULT" = success
          test "$STATIC_DELIVERY_RESULT" = success
          test "$CHECK_RESULT" = success
          test "$IMAGE_RESULT" = success
          test "$PLAN_RESULT" = success
      - name: Require complete suite evidence
        env:
          EXPECTED_RUNTIMES: ${{ needs.profile.outputs.verification-runtimes }}
        run: node scripts/verification/aggregate.mjs --reports .context/downloaded-verification --commit "${GITHUB_SHA}" --runtimes "$EXPECTED_RUNTIMES"

  timing:
    name: CI timing
    # Report only: Required CI does not need this job, so it never delays or
    # gates the branch rule. It runs after every other job, also after a failure.
    # A failure of this job never fails the run, so release evidence keeps it.
    if: ${{ always() }}
    continue-on-error: true
    needs:
      - required
      - site-lighthouse
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the timing report
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Download suite evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: verification-*
          path: .context/downloaded-verification
      - name: Report job durations against their budgets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verification/ci-timing.mjs --reports .context/downloaded-verification --self "CI timing"
