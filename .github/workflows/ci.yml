name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PLAYWRIGHT_CHANNEL: chromium

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  minimum-runtime:
    name: Minimum Node 22.14
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Set up npm
        run: npm install --global npm@11.7.0
      - name: Set up Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.95.0
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run complete verification
        run: cargo xtask check
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failures-node-22
          path: test-results/

  release-runtime:
    name: Release Node 24
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Set up npm
        run: npm install --global npm@11.7.0
      - name: Set up Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.95.0
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run complete verification
        run: cargo xtask check
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failures-node-24
          path: test-results/

  export-platforms:
    name: Export filesystem (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Set up npm
        run: npm install --global npm@11.7.0
      - name: Install dependencies
        run: npm ci
      - name: Build package
        run: npm run build
      - name: Verify exclusive directory transactions
        run: node --import tsx --test tests/export_rename.test.ts tests/export_destination_races.test.ts
      - name: Verify native CSS rule parsing and diffing
        run: node --import tsx --test tests/review_css_rules.test.ts tests/review_css_diff.test.ts
      - name: Verify native baseline commands
        run: node --import tsx --test tests/baseline_platform.test.ts tests/baseline_process_tree.test.ts

  site-lighthouse:
    name: Site Lighthouse
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Set up npm
        run: npm install --global npm@11.7.0
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Select Chromium for Lighthouse
        run: node --input-type=module -e 'import { chromium } from "playwright"; console.log("CHROME_PATH=" + chromium.executablePath())' >> "$GITHUB_ENV"
      - name: Build site and catalogue
        run: npm run build && npm run example:build && npm run site:build
      - name: Run Lighthouse budget
        shell: bash
        run: |
          mkdir -p test-results/site-lighthouse
          npm run site:lighthouse 2>&1 | tee test-results/site-lighthouse/report.txt
      - name: Retain Lighthouse failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-lighthouse-failures
          path: test-results/site-lighthouse/

  required:
    name: Required CI
    if: always()
    needs: [minimum-runtime, release-runtime, export-platforms, site-lighthouse]
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job
        env:
          MINIMUM_RESULT: ${{ needs.minimum-runtime.result }}
          RELEASE_RESULT: ${{ needs.release-runtime.result }}
          EXPORT_PLATFORMS_RESULT: ${{ needs.export-platforms.result }}
          SITE_LIGHTHOUSE_RESULT: ${{ needs.site-lighthouse.result }}
        run: |
          test "$MINIMUM_RESULT" = success
          test "$RELEASE_RESULT" = success
          test "$EXPORT_PLATFORMS_RESULT" = success
          test "$SITE_LIGHTHOUSE_RESULT" = success
