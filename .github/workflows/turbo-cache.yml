name: Turbo Cache Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/turbo-cache/**
      - .github/workflows/turbo-cache.yml
      - package.json
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: turbo-cache-worker
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: "1"
  TURBO_CACHE: local:rw
  WRANGLER_SEND_METRICS: "false"

jobs:
  deploy:
    environment: turbo-cache-deploy
    if: github.repository == 'mokly-ai/mokly' && github.ref == 'refs/heads/main'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Validate Cloudflare configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
        run: |
          missing=0
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error title=Missing CLOUDFLARE_ACCOUNT_ID::Set repository variable CLOUDFLARE_ACCOUNT_ID."
            missing=1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error title=Missing Cloudflare API token::Set environment secret CLOUDFLARE_WORKERS_API_TOKEN in turbo-cache-deploy."
            missing=1
          fi
          exit "${missing}"
      - name: Install npm
        run: npm install --global npm@11.21.0
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm run dependencies:check
      - name: Typecheck Worker
        run: npm run typecheck:turbo-cache
      - name: Test Worker
        run: node --import tsx --test tests/turbo_cache_*.test.ts
      - name: Deploy Worker
        run: npx --no-install wrangler deploy --config scripts/turbo-cache/wrangler.jsonc
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
