<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1024"
  height="1024"
  viewBox="0 0 1024 1024"
  role="img"
  aria-labelledby="mokly-app-icon-title"
>
  <title id="mokly-app-icon-title">Mokly</title>
  <defs>
    <filter id="plate-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow
        dx="0"
        dy="12"
        stdDeviation="14"
        flood-color="#000000"
        flood-opacity="0.28"
      />
    </filter>
  </defs>
  <!-- The macOS icon grid: an 824 px plate centred on the 1024 px canvas. -->
  <rect
    x="100"
    y="100"
    width="824"
    height="824"
    rx="186"
    fill="#ffffff"
    filter="url(#plate-shadow)"
  />
  <!-- The brand mark in the light Canvas colours on its 32-unit grid: the
       ink outline frame, the signal front layer with its two rules, and the
       front layer's halo in the light surface white, which is the plate's. -->
  <g transform="translate(224 224) scale(18)">
    <rect
      x="3.6"
      y="3.6"
      width="18.8"
      height="19.8"
      rx="4.6"
      fill="none"
      stroke="#0d1410"
      stroke-width="1.8"
    />
    <rect
      x="9"
      y="8"
      width="20"
      height="21"
      rx="4.8"
      fill="#12b76a"
      paint-order="stroke"
      stroke="#ffffff"
      stroke-width="1.6"
    />
    <path
      d="M14 15h10M14 20h7"
      fill="none"
      stroke="#04130b"
      stroke-width="2.1"
      stroke-linecap="round"
    />
  </g>
</svg>
